<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compositor — 長編執筆ツール</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.7/lib/marked.umd.js"></script>
<script src="https://unpkg.com/lucide@1.25.0/dist/umd/lucide.min.js"></script>
<style>
  :root{ --gold:#c2a76b; --gold-hi:#ddc088; --gold-deep:#8a6a2c; }
  body{ background:#0b1220; }
  .accent{ color:var(--gold); }
  .btn-gold{ background:rgba(194,167,107,.12); color:var(--gold-hi); border:1px solid rgba(194,167,107,.35); }
  .btn-gold:hover{ background:rgba(194,167,107,.22); }
  textarea, input, select { font-feature-settings:"palt"; }
  .chapter-item.active{ background:rgba(194,167,107,.14); border-left-color:var(--gold); }
  /* スクロールバー */
  *{ scrollbar-width:thin; scrollbar-color:rgba(194,167,107,.45) transparent; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background-color:rgba(194,167,107,.35); border-radius:9999px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover{ background-color:rgba(194,167,107,.6); background-clip:padding-box; }
  .auto-grow{ min-height:120px; }
  /* 画像を落とせる場所であることを、落としかけた瞬間だけ示す */
  .drop-on{ outline:2px dashed var(--gold); outline-offset:-4px; background:rgba(194,167,107,.07) !important; }
  #blockArea.drop-on{ outline-offset:-8px; }
  #toast{ opacity:0; transition:opacity .25s ease; pointer-events:none; }
  .img-tile{ transition:border-color .15s, background .15s; }
  .img-tile:hover{ border-color:rgba(194,167,107,.45); background:rgba(194,167,107,.06); }
  .img-thumb{ background-image:linear-gradient(45deg,#1a2334 25%,transparent 25%,transparent 75%,#1a2334 75%),linear-gradient(45deg,#1a2334 25%,#131c2b 25%,#131c2b 75%,#1a2334 75%); background-size:14px 14px; background-position:0 0,7px 7px; }
</style>
</head>
<body class="text-slate-200 h-screen flex flex-col overflow-hidden font-sans">

<!-- ヘッダー -->
<header class="h-14 bg-[#0e1626] border-b border-slate-800/80 flex items-center justify-between px-4 shrink-0">
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2">
      <i data-lucide="book-open-text" class="w-5 h-5 accent"></i>
      <span class="font-bold tracking-[.2em] text-sm text-slate-200">COMPOSITOR</span>
    </div>
    <div class="flex items-center gap-1.5 bg-[#0b1220] border border-slate-800 rounded px-2 py-1">
      <i data-lucide="library" class="w-3.5 h-3.5 text-slate-500"></i>
      <select id="bookSelect" onchange="handleBookChange(this.value)" class="bg-transparent text-xs font-semibold text-slate-300 focus:outline-none cursor-pointer pr-3 max-w-[220px]"></select>
    </div>
    <button onclick="openMetaModal()" class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-slate-400 hover:text-slate-200 border border-slate-800 rounded transition cursor-pointer">
      <i data-lucide="settings-2" class="w-3.5 h-3.5"></i> 書誌情報
    </button>
    <button onclick="openImageModal()" class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs text-slate-400 hover:text-slate-200 border border-slate-800 rounded transition cursor-pointer">
      <i data-lucide="image" class="w-3.5 h-3.5"></i> 画像<span id="imgCount" class="text-[10px] font-mono text-slate-600"></span>
    </button>
  </div>
  <div class="flex items-center gap-2">
    <div id="progressLabel" class="text-[11px] font-mono text-slate-500 mr-2"></div>
    <button onclick="setPreviewMode('chapter')" id="pvChapter" class="px-2.5 py-1.5 text-xs rounded border border-slate-800 text-slate-400 hover:text-slate-200 transition cursor-pointer">章</button>
    <button onclick="setPreviewMode('book')" id="pvBook" class="px-2.5 py-1.5 text-xs rounded border border-slate-800 text-slate-400 hover:text-slate-200 transition cursor-pointer">全体</button>
    <div class="h-4 w-px bg-slate-800 mx-1"></div>
    <button onclick="exportBookHtml()" class="btn-gold flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded transition cursor-pointer">
      <i data-lucide="file-down" class="w-3.5 h-3.5"></i> 本を書き出す
    </button>
    <button onclick="exportProject()" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-800/70 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition cursor-pointer" title="章ごとのMarkdownに分けてzipで書き出す（git向け）">
      <i data-lucide="folder-down" class="w-3.5 h-3.5"></i>
    </button>
    <label class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-800/70 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition cursor-pointer" title="プロジェクトzipを読み込む">
      <i data-lucide="folder-up" class="w-3.5 h-3.5"></i>
      <input type="file" accept=".zip" class="hidden" onchange="importProject(event)">
    </label>
    <div class="h-4 w-px bg-slate-800 mx-1"></div>
    <button onclick="exportBackup()" class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-800/70 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition cursor-pointer" title="全データのJSONバックアップ">
      <i data-lucide="download" class="w-3.5 h-3.5"></i>
    </button>
    <label class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-800/70 hover:bg-slate-700 text-slate-300 text-xs rounded border border-slate-700 transition cursor-pointer" title="バックアップを読み込む">
      <i data-lucide="upload" class="w-3.5 h-3.5"></i>
      <input type="file" accept=".json" class="hidden" onchange="importBackup(event)">
    </label>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">
  <!-- 章リスト -->
  <aside class="w-60 bg-[#0e1626] border-r border-slate-800/80 flex flex-col shrink-0">
    <div class="p-3 border-b border-slate-800/60 flex flex-col gap-2">
      <button onclick="addChapter('body')" class="w-full flex items-center justify-center gap-2 btn-gold font-medium py-2 px-3 text-sm rounded transition cursor-pointer">
        <i data-lucide="plus" class="w-4 h-4"></i> 章を追加
      </button>
      <div class="flex gap-1.5">
        <button onclick="addChapter('front')" class="flex-1 py-1 text-[11px] text-slate-400 hover:text-slate-200 border border-slate-800 rounded transition cursor-pointer">前付</button>
        <button onclick="addChapter('back')" class="flex-1 py-1 text-[11px] text-slate-400 hover:text-slate-200 border border-slate-800 rounded transition cursor-pointer">後付</button>
      </div>
    </div>
    <div id="chapterList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
  </aside>

  <!-- エディタ -->
  <main class="flex-1 flex overflow-hidden">
    <div class="w-1/2 flex flex-col border-r border-slate-800/80 overflow-hidden">
      <div id="chapterMeta" class="p-4 border-b border-slate-800/60 shrink-0 bg-[#0e1626]/40"></div>
      <div id="blockArea" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div id="blockPalette" class="shrink-0 border-t border-slate-800/60 p-3 flex flex-wrap gap-2 bg-[#0e1626]/40"></div>
    </div>
    <div class="w-1/2 flex flex-col overflow-hidden bg-[#f5f3ec]">
      <iframe id="previewFrame" class="flex-1 w-full border-0" title="プレビュー"></iframe>
    </div>
  </main>
</div>

<datalist id="langList">
  <option value="json">
  <option value="yaml">
  <option value="text">
  <option value="python">
  <option value="javascript">
  <option value="typescript">
  <option value="java">
  <option value="kotlin">
  <option value="go">
  <option value="rust">
  <option value="cpp">
  <option value="c">
  <option value="csharp">
  <option value="swift">
  <option value="ruby">
  <option value="php">
  <option value="scala">
  <option value="sql">
  <option value="bash">
  <option value="html">
  <option value="css">
  <option value="dockerfile">
  <option value="hcl">
  <option value="markdown">
</datalist>

<!-- 画像モーダル -->
<div id="imgModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-[#0e1626] border border-slate-800 rounded-lg shadow-2xl max-w-3xl w-full max-h-[88vh] flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-slate-800 shrink-0">
      <div class="flex items-center gap-2"><i data-lucide="image" class="w-5 h-5 accent"></i><h3 class="font-bold text-slate-200">画像</h3>
        <span id="imgTotal" class="text-[11px] font-mono text-slate-500"></span></div>
      <button onclick="closeImageModal()" class="p-1.5 text-slate-400 bg-slate-800 hover:bg-slate-700 rounded text-xs cursor-pointer">✕</button>
    </div>
    <div class="overflow-y-auto p-4 space-y-4">
      <label id="imgDrop" class="block border border-dashed border-slate-700 rounded-lg py-7 text-center cursor-pointer hover:border-[color:var(--gold)] transition">
        <i data-lucide="image-plus" class="w-6 h-6 mx-auto mb-2 text-slate-600"></i>
        <p class="text-sm text-slate-400">画像をここにドラッグ＆ドロップ、またはクリックして選ぶ</p>
        <p class="text-[11px] text-slate-600 mt-1">本文の欄に直接ドロップすれば、カーソルの位置に差し込まれます</p>
        <input type="file" accept="image/*" multiple class="hidden" onchange="pickImages(event)">
      </label>
      <div id="imgGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </div>
    <div class="p-4 border-t border-slate-800 flex items-center justify-between shrink-0">
      <p class="text-[11px] text-slate-600">表紙・奥付に使うときは「書誌情報」から選びます。書き出す本には画像が埋め込まれ、プロジェクトzipでは <code class="text-slate-500">images/</code> に入ります。</p>
      <button onclick="closeImageModal()" class="btn-gold px-4 py-2 text-sm font-semibold rounded cursor-pointer">閉じる</button>
    </div>
  </div>
</div>

<!-- 書誌情報モーダル -->
<div id="metaModal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-[#0e1626] border border-slate-800 rounded-lg shadow-2xl max-w-2xl w-full max-h-[88vh] flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-slate-800 shrink-0">
      <div class="flex items-center gap-2"><i data-lucide="settings-2" class="w-5 h-5 accent"></i><h3 class="font-bold text-slate-200">書誌情報</h3></div>
      <button onclick="closeMetaModal()" class="p-1.5 text-slate-400 bg-slate-800 hover:bg-slate-700 rounded text-xs cursor-pointer">✕</button>
    </div>
    <div id="metaForm" class="overflow-y-auto p-4 grid grid-cols-2 gap-3"></div>
    <div class="p-4 border-t border-slate-800 flex justify-between shrink-0">
      <button onclick="deleteBook()" class="px-3 py-2 text-xs text-rose-400/80 hover:text-rose-300 cursor-pointer">この本を削除</button>
      <button onclick="closeMetaModal()" class="btn-gold px-4 py-2 text-sm font-semibold rounded cursor-pointer">閉じる</button>
    </div>
  </div>
</div>

<script>
const BOOK_CSS = "  :root{\n    --paper:#f5f3ec;\n    --card:#fffdf8;\n    --ink:#20283a;\n    --ink-strong:#131a29;\n    --ink-soft:#3c465a;\n    --ink-dim:#697485;\n    --night:#0e1626;\n    --night-2:#0b1220;\n    --ivory:#ece5d8;\n    --ivory-dim:#aeb5c4;\n    --gold:#c2a76b;\n    --gold-hi:#ddc088;\n    --gold-deep:#8a6a2c;\n    --gold-ink:#8f6f2f;\n    --tok-key:#d8b978;\n    --tok-str:#9fb6a0;\n    --tok-num:#93b3d1;\n    --line:rgba(138,106,44,.24);\n    --line-soft:rgba(105,116,133,.18);\n    --serif:'Noto Serif JP',serif;\n    --latin:'Cormorant Garamond',serif;\n    --sans:'Noto Sans JP',sans-serif;\n    --mono:'JetBrains Mono','Noto Sans JP',monospace;\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:2.02;font-size:16.5px;letter-spacing:.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n  ::selection{background:rgba(194,167,107,.26)}\n\n  .cover{background:radial-gradient(120% 90% at 78% -10%, rgba(194,167,107,.10), transparent 60%),linear-gradient(158deg,var(--night),var(--night-2));color:var(--ivory);border-bottom:3px solid var(--gold);padding:clamp(56px,10vw,120px) 0 clamp(44px,7vw,84px)}\n  .cover .inner{max-width:780px;margin:0 auto;padding:0 30px}\n  .cover .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:26px}\n  .cover h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,7vw,62px);line-height:1.34;letter-spacing:.02em;color:#fff;margin-bottom:14px}\n  .cover .provisional{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--gold);opacity:.8;margin-bottom:20px}\n  .cover .sub{font-family:var(--latin);font-style:italic;font-weight:500;font-size:clamp(17px,2.6vw,23px);color:var(--ivory-dim);letter-spacing:.02em;line-height:1.6;max-width:34em}\n  .thesis-strip{margin-top:38px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ivory-dim)}\n  .thesis-strip b{color:var(--gold-hi);font-weight:500}\n  .thesis-strip .arrow{color:var(--gold);opacity:.7}\n  .thesis-strip .derive{color:var(--ivory);opacity:.85}\n\n  .draftnote{max-width:720px;margin:0 auto;padding:clamp(30px,5vw,48px) 30px 0}\n  .draftnote .box{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:18px 22px;background:var(--card)}\n  .draftnote .box p{font-size:14px;line-height:1.9;color:var(--ink-soft);margin:0}\n  .draftnote .box .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px}\n\n  .toc{max-width:720px;margin:0 auto;padding:clamp(34px,5vw,52px) 30px clamp(20px,4vw,40px)}\n  .toc .lead{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:22px}\n  .toc ol{list-style:none}\n  .toc li{border-top:1px solid var(--line-soft)}\n  .toc li:last-child{border-bottom:1px solid var(--line-soft)}\n  .toc a,.toc .row{display:flex;align-items:baseline;gap:16px;padding:15px 4px;text-decoration:none;color:var(--ink-soft);transition:color .18s,background .18s}\n  .toc a:hover,.toc a:focus-visible{color:var(--ink-strong);background:rgba(194,167,107,.06);outline:none}\n  .toc a:focus-visible{box-shadow:inset 3px 0 0 var(--gold)}\n  .toc .row.pending{color:var(--ink-dim)}\n  .toc .n{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--gold-deep);min-width:44px;flex-shrink:0}\n  .toc .t{font-family:var(--serif);font-weight:500;font-size:16.5px;letter-spacing:.01em;flex:1}\n  .toc .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);border:1px solid var(--line);border-radius:20px;padding:2px 9px;flex-shrink:0}\n  .toc .st.draft{color:var(--gold-deep)}\n  .toc .st.plan{color:var(--ink-dim);border-color:var(--line-soft)}\n\n  .book{max-width:940px;margin:0 auto;position:relative}\n  @media(min-width:900px){\n    .book{padding-left:150px}\n    .book::before{content:'';position:absolute;left:98px;top:34px;bottom:120px;width:1px;background:linear-gradient(var(--gold) 0%, rgba(194,167,107,.28) 82%, transparent 100%)}\n  }\n  .reading{max-width:640px}\n  section.movement{padding:clamp(30px,5vw,52px) 30px}\n  section.movement:first-of-type{padding-top:8px}\n  .divider{position:relative;margin:8px 0 34px}\n  .divider .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:12px;display:block}\n  .divider h2{font-family:var(--serif);font-weight:600;font-size:clamp(23px,4.2vw,33px);line-height:1.4;letter-spacing:.02em;color:var(--ink-strong)}\n  .divider .rule{width:52px;height:2px;background:var(--gold);margin-top:18px;border-radius:2px}\n  @media(min-width:900px){\n    .divider .node{position:absolute;left:-58px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--gold);box-shadow:0 0 0 4px var(--paper)}\n    .divider .node::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--gold)}\n  }\n  .frontmatter .divider h2{font-family:var(--serif);font-weight:500}\n  .prose p{margin:0 0 1.35em;color:var(--ink-soft)}\n  .prose p:last-child{margin-bottom:0}\n  .prose strong{color:var(--ink-strong);font-weight:500}\n  .prose em{font-style:normal;color:var(--gold-ink);font-weight:500}\n  .prose .lead-in{color:var(--ink);font-weight:400}\n  .prose h3{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink-strong);letter-spacing:.02em;margin:2.1em 0 .9em;line-height:1.6}\n  .prose table{border-collapse:collapse;inline-size:100%;margin:1.2em 0;font-size:.92em;line-height:1.7}\n  .prose th,.prose td{border-bottom:1px solid var(--line-soft);padding:.4em .6em;vertical-align:top;text-align:start}\n  .prose thead th{border-bottom:1px solid var(--line);font-weight:600;color:var(--ink-strong);white-space:nowrap}\n  .en{font-family:var(--latin);font-style:italic;font-size:1.06em;letter-spacing:.01em}\n\n  figure{margin:2.1em 0}\n  .fig-card{background:linear-gradient(160deg,var(--night),var(--night-2));border:1px solid rgba(194,167,107,.16);border-radius:12px;padding:26px 20px 20px;box-shadow:0 14px 34px rgba(14,22,38,.14)}\n  .fig-card svg{display:block;width:100%;height:auto}\n  figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.75;color:var(--ink-dim);margin-top:14px;padding-left:14px;border-left:2px solid var(--gold)}\n\n  /* outline cards for chapters not yet drafted */\n  .outline{display:flex;flex-direction:column;gap:16px;margin-top:8px}\n  .outline .card{border:1px solid var(--line-soft);border-radius:10px;padding:20px 22px;background:var(--card)}\n  .outline .card .ch{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:8px}\n  .outline .card h4{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink-strong);letter-spacing:.02em;margin-bottom:10px;line-height:1.5}\n  .outline .card p{font-size:14.5px;line-height:1.9;color:var(--ink-soft);margin:0}\n\n  .colophon{background:linear-gradient(158deg,var(--night),var(--night-2));color:var(--ivory-dim);border-top:3px solid var(--gold);margin-top:clamp(50px,8vw,90px);padding:clamp(40px,6vw,64px) 30px}\n  .colophon .inner{max-width:640px;margin:0 auto}\n  .colophon .mark{font-family:var(--serif);font-weight:500;font-style:italic;font-size:19px;color:var(--ivory);line-height:1.7;margin-bottom:22px;letter-spacing:.02em}\n  .colophon .meta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;line-height:2.2;color:var(--ivory-dim)}\n  .colophon .meta b{color:var(--gold-hi);font-weight:500}\n\n  @media(prefers-reduced-motion:no-preference){\n    .cover .kicker,.cover h1,.cover .sub,.cover .thesis-strip{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}\n    .cover h1{animation-delay:.08s}.cover .sub{animation-delay:.18s}.cover .thesis-strip{animation-delay:.30s}\n    @keyframes rise{to{opacity:1;transform:none}}\n  }\n  @media print{\n    body{font-size:11pt;line-height:1.9} html:not(.paper-mode) body{background:#fff}\n    html:not(.paper-mode) .cover,html:not(.paper-mode) .colophon{background:#fff!important;color:#000;border-color:#000}\n    html:not(.paper-mode) .cover h1,html:not(.paper-mode) .cover .sub,html:not(.paper-mode) .colophon .mark{color:#000}\n    html:not(.paper-mode) .book::before,html:not(.paper-mode) .divider .node{display:none}html:not(.paper-mode) .book{padding-left:0}\n    .divider{page-break-after:avoid;page-break-before:always}.frontmatter .divider{page-break-before:avoid}\n    html:not(.paper-mode) .fig-card{background:#f4f2ec!important;border:1px solid #ccc;box-shadow:none}\n    figcaption{color:#333}\n    html:not(.paper-mode) .draftnote{display:none}\n  }\n\n  /* ---- code cards (from vol.1) ---- */\n  .code{\n    background:linear-gradient(160deg,var(--night),var(--night-2));\n    border:1px solid rgba(194,167,107,.16);border-radius:11px;\n    margin:1.9em 0;overflow:hidden;box-shadow:0 14px 34px rgba(14,22,38,.14);\n  }\n  .code .bar{\n    display:flex;align-items:center;gap:8px;padding:11px 16px;\n    border-bottom:1px solid rgba(194,167,107,.14);\n    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;\n    color:var(--ivory-dim);\n  }\n  .code pre{\n    margin:0;padding:18px 20px;overflow-x:auto;\n    font-family:var(--mono);font-size:13px;line-height:1.85;color:#c9cedd;font-weight:400;\n    letter-spacing:0;\n  }\n  .code .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.85}\n  .code .k{color:var(--tok-key)}\n  .code .s{color:var(--tok-str)}\n  .code .n{color:var(--tok-num)}\n  .code .p{color:#6b7488}\n  .code .c{color:#7a8394;font-style:italic}\n  .code .f{color:#9fd0c4}\n\n  /* ================= \u7e26\u7d44\u307f\u30e2\u30fc\u30c9 ================= */\n  html.vertical{ height:100%; }\n  body.vertical{\n    writing-mode:vertical-rl;\n    text-orientation:mixed;\n    height:100vh;\n    overflow-x:auto; overflow-y:hidden;\n    scroll-behavior:smooth;\n  }\n  /* \u6a2a\u7d44\u307f\u524d\u63d0\u306e\u7269\u7406\u6307\u5b9a\u3092\u89e3\u9664 */\n  body.vertical .cover .inner,\n  body.vertical .draftnote,\n  body.vertical .toc,\n  body.vertical .book,\n  body.vertical .reading,\n  body.vertical .colophon .inner{ max-width:none; }\n\n  /* \u8868\u7d19\u30fb\u8349\u7a3f\u30ce\u30fc\u30c8\u30fb\u76ee\u6b21\u30fb\u5965\u4ed8\u306f\u3001\u305d\u308c\u305e\u308c1\u753b\u9762 */\n  body.vertical .cover,\n  body.vertical .draftnote,\n  body.vertical .toc,\n  body.vertical .colophon{\n    width:100vw; height:100%;\n    padding:clamp(30px,6vh,64px) clamp(28px,4vw,56px);\n    margin:0;\n    display:flex; align-items:center; justify-content:center;\n  }\n  body.vertical .cover{ border-bottom:0; border-left:3px solid var(--gold); }\n  body.vertical .cover .inner{ max-height:820px; margin:0; padding:0; }\n  body.vertical .cover h1{ line-height:1.5; }\n  body.vertical .cover .sub{ max-width:none; max-height:34em; }\n  body.vertical .thesis-strip{ margin-top:0; margin-right:38px; }\n  body.vertical .draftnote .box{\n    max-height:640px; border-left:1px solid var(--line);\n    border-top:3px solid var(--gold); border-inline-start:1px solid var(--line);\n  }\n  body.vertical .colophon{ border-top:0; border-right:3px solid var(--gold); margin:0; }\n  body.vertical .colophon .inner{ max-height:640px; margin:0; }\n\n  /* \u76ee\u6b21 */\n  body.vertical .toc li{ border-top:0; border-right:1px solid var(--line-soft); }\n  body.vertical .toc li:last-child{ border-bottom:0; border-left:1px solid var(--line-soft); }\n  body.vertical .toc .n{ min-width:0; min-height:44px; }\n  body.vertical .toc a,body.vertical .toc .row{ padding:4px 15px; }\n  body.vertical .toc a:focus-visible{ box-shadow:inset 0 3px 0 var(--gold); }\n\n  /* \u672c\u6587 */\n  /* \u5929\uff08\u4e0a\u4f59\u767d\uff09\u3068\u5730\uff08\u4e0b\u4f59\u767d\uff09\u3002\u6bb5\u306e\u9ad8\u3055\u3092\u524a\u308a\u3059\u304e\u306a\u3044\u3088\u3046\u63a7\u3048\u3081\u306b\u53d6\u308b */\n  body.vertical{ --v-ten:clamp(34px,6vh,72px); --v-chi:clamp(22px,3.5vh,42px);\n    /* \u98fe\u308a\u306e\u6301\u3061\u4e0a\u3052\u91cf\u3002\u5929\u3088\u308a\u5927\u304d\u304f\u306a\u3089\u306a\u3044\u3088\u3046\u306b\u3057\u3066\u4e0a\u7aef\u306e\u306f\u307f\u51fa\u3057\u3092\u9632\u3050 */\n    --v-node:min(36px,calc(var(--v-ten) - 12px)); }\n  body.vertical .book{ padding-left:0; padding-top:var(--v-ten); }\n  body.vertical section.movement{ padding:0 clamp(30px,5vw,52px) var(--v-chi); }\n  body.vertical section.movement:first-of-type{ padding-right:8px; }\n  body.vertical .prose{ text-combine-upright:digits 2; }\n  /* \u7b49\u5e45\u6307\u5b9a\u306e\u8981\u7d20\u306b\u3082\u65e5\u672c\u8a9e\u306e\u7e26\u7d44\u307f\u5b57\u5f62\u3092\u52b9\u304b\u305b\u308b */\n  body.vertical .thesis-strip,body.vertical .kicker,body.vertical .provisional,\n  body.vertical .toc .n,body.vertical .toc .st,body.vertical .colophon .meta,\n  body.vertical .draftnote .box .h{\n    font-family:'JetBrains Mono','Noto Sans JP',monospace;\n    font-feature-settings:\"vert\" 1;\n  }\n  body.vertical .prose p{ margin:0 0 0 1.35em; }\n  body.vertical .prose h3{ margin:0 2.1em 0 .9em; }\n\n  /* \u7ae0\u898b\u51fa\u3057 */\n  body.vertical .divider{ margin:0 8px 0 34px; }\n  body.vertical .divider .rule{ width:2px; height:52px; margin-top:0; margin-right:18px; }\n  @media(min-width:900px){\n    body.vertical .book::before{\n      left:120px; right:34px; top:calc(var(--v-ten) - var(--v-node)); bottom:auto; width:auto; height:1px;\n      background:linear-gradient(to left,var(--gold) 0%,rgba(194,167,107,.28) 82%,transparent 100%);\n    }\n    body.vertical .divider .node{ left:auto; right:5px; top:calc(-1 * var(--v-node)); }\n  }\n\n  /* \u30b3\u30fc\u30c9\u56f3\u7248\u30fb\u56f3\u7248\u306f\u6a2a\u7d44\u307f\u306e\u5cf6\u3068\u3057\u3066\u7f6e\u304d\u3001\u672c\u6587\u3092\u56de\u308a\u8fbc\u307e\u305b\u308b\u3002\n     \u7e26\u7d44\u307f\u3067\u306f float:inline-start \u304c\u300c\u6bb5\u306e\u4e0a\u7aef\u306b\u5bc4\u305b\u308b\u300d\u610f\u5473\u306b\u306a\u308a\u3001\n     \u7d9a\u304f\u672c\u6587\u304c\u305d\u306e\u4e0b\u306e\u7a7a\u304d\u3078\u6d41\u308c\u8fbc\u3080\uff08\u56de\u308a\u8fbc\u307f\uff09\u3002 */\n  body.vertical .code,\n  body.vertical figure{\n    writing-mode:horizontal-tb;\n    text-combine-upright:none;\n    float:inline-start;\n    clear:inline-start;\n    width:min(520px,64vw);\n    height:fit-content;\n    max-height:64vh;\n    margin:0 0 1.5em 1.7em;\n    overflow:hidden;\n  }\n  body.vertical figure{ margin:0 0 1.6em 1.9em; }\n  body.vertical figcaption{ writing-mode:horizontal-tb; }\n  /* \u56de\u308a\u8fbc\u307e\u305b\u305f\u56f3\u7248\u304c\u7bc0\u306e\u5916\u3078\u306f\u307f\u51fa\u3055\u306a\u3044\u3088\u3046\u306b\u9589\u3058\u308b */\n  body.vertical .prose::after,\n  body.vertical .reading::after{ content:''; display:block; clear:both; }\n\n  /* \u30da\u30fc\u30b8\u9001\u308a */\n  .pager{\n    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);\n    writing-mode:horizontal-tb; display:flex; gap:8px; z-index:60;\n  }\n  .pager button{\n    font-family:var(--mono); font-size:16px; line-height:1;\n    background:var(--card); color:var(--gold-deep);\n    border:1px solid var(--line); border-radius:999px;\n    padding:9px 16px; cursor:pointer; opacity:.55;\n    transition:opacity .2s,background .2s;\n  }\n  .pager button:hover{ opacity:1; background:#fff; }\n  @media print{ .pager{ display:none } }\n\n  /* ================= \u56f3\u8868\u30ab\u30fc\u30c9 ================= */\n  .c-figure-card{\n    --card-bg:#fdfbf7; --card-border:rgba(26,26,30,.18);\n    --text-primary:#1a1a1e; --text-heading:#1a1a1e; --text-sub:#5a5a62;\n    --node-bg:#ffffff; --node-border:#1a1a1e; --badge-color:#a8382a; --accent:#a8382a;\n    /* \u56f3\u4e2d\u306e\u5c0f\u3055\u306a\u30e9\u30d9\u30eb\u7528\u3002\u672a\u5b9a\u7fa9\u3060\u3068SVG\u304c\u9ed2\u306b\u843d\u3061\u308b\u305f\u3081\u5fc5\u305a\u5b9a\u7fa9\u3059\u308b */\n    --bg-main:#f6f2e9;\n    --label-ink:#8f2f22;\n  }\n  /* \u6975\u5c0f\u306e\u7b49\u5e45\u30e9\u30d9\u30eb\u306f\u3001\u3088\u308a\u6fc3\u3044\u8d64\u3067\u53ef\u8aad\u6027\u3092\u78ba\u4fdd\u3059\u308b */\n  .c-figure-card .c-matrix-col-head,\n  .c-figure-card .c-matrix-row-head,\n  .c-figure-card .c-gantt-th,\n  .c-figure-card .c-gantt-bar,\n  .c-figure-card .c-quad-label,\n  .c-figure-card .c-vtl-time,\n  .c-figure-card .c-layer-desc,\n  .c-figure-card .c-net-subnet-title{ color:var(--label-ink); }\n  \n  .c-figure-card {\n    background: var(--card-bg);\n    border: 1px solid var(--card-border); border-radius: 12px; padding: 24px 20px;\n    box-shadow: 0 10px 30px rgba(0,0,0,.08); color: var(--text-primary);\n  }\n  .c-fig-badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--badge-color); text-transform: uppercase; font-weight: 600; }\n  .c-fig-title { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--text-heading); margin-top: 4px; line-height: 1.4; }\n\n  /* Metrics */\n  .c-metric-strip { display: grid; gap: 12px; margin-top: 14px; }\n  .c-metric-strip.cols-1 { grid-template-columns: 1fr; }\n  .c-metric-strip.cols-2 { grid-template-columns: repeat(2, 1fr); }\n  .c-metric-strip.cols-3 { grid-template-columns: repeat(3, 1fr); }\n  .c-metric-strip.cols-4 { grid-template-columns: repeat(4, 1fr); }\n  .c-metric-cell { background: rgba(0,0,0,.03); border: 1px solid var(--card-border); border-radius: 8px; padding: 18px 12px; text-align: center; }\n  .c-metric-num { font-family: var(--serif); font-size: 42px; font-weight: 600; color: var(--text-heading); }\n  .c-metric-caption { font-size: 12px; color: var(--text-sub); margin-top: 8px; }\n\n  /* Matrix */\n  .c-matrix-grid { display: grid; gap: 6px; margin-top: 12px; }\n  .c-matrix-col-head, .c-matrix-row-head { font-family: var(--mono); font-size: 11px; color: var(--badge-color); display: flex; align-items: center; justify-content: center; }\n  .c-matrix-cell { border: 1px solid var(--card-border); border-radius: 6px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 52px; background: var(--node-bg); }\n\n  /* Quad */\n  .c-quad-canvas { position: relative; height: 260px; margin-top: 14px; background: rgba(0,0,0,.02); border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; }\n  .c-quad-axis-v { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--card-border); }\n  .c-quad-axis-h { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--card-border); }\n  .c-quad-label { position: absolute; font-family: var(--mono); font-size: 10px; color: var(--badge-color); opacity: 0.8; }\n  .c-quad-label.top { top: 8px; left: 50%; transform: translateX(-50%); }\n  .c-quad-label.bottom { bottom: 8px; left: 50%; transform: translateX(-50%); }\n  .c-quad-label.left { left: 8px; top: 50%; transform: translateY(-50%); }\n  .c-quad-label.right { right: 8px; top: 50%; transform: translateY(-50%); }\n  .c-quad-node { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; white-space: nowrap; }\n  .c-quad-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--badge-color); }\n  .c-quad-node-title { font-size: 11.5px; color: var(--text-heading); font-weight: 500; background: var(--node-bg); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--card-border); }\n\n  /* Network Canvas */\n  .c-net-subnet { border: 1.5px dashed var(--card-border); border-radius: 8px; padding: 12px; margin-top: 10px; background: rgba(0,0,0,0.015); }\n  .c-net-subnet-title { font-family: var(--mono); font-size: 10.5px; color: var(--badge-color); font-weight: 600; margin-bottom: 8px; }\n  .c-net-nodes { display: flex; gap: 12px; flex-wrap: wrap; }\n  .c-net-node-box { background: var(--node-bg); border: 1.2px solid var(--node-border); border-radius: 6px; padding: 8px 12px; font-size: 11px; font-weight: 500; color: var(--text-heading); }\n\n  /* Layer Architecture */\n  .c-layer-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }\n  .c-layer-item { background: var(--node-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }\n  .c-layer-title { font-weight: 600; font-size: 13px; color: var(--text-heading); }\n  .c-layer-desc { font-family: var(--mono); font-size: 11px; color: var(--badge-color); }\n\n  /* Timeline */\n  .c-vtimeline { position: relative; margin-top: 14px; padding-left: 20px; }\n  .c-vtl-line { position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--card-border); }\n  .c-vtl-item { position: relative; margin-bottom: 18px; display: flex; flex-direction: column; gap: 2px; }\n  .c-vtl-node { position: absolute; left: -20px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--node-bg); border: 2px solid var(--badge-color); }\n  .c-vtl-time { font-family: var(--mono); font-size: 11px; color: var(--badge-color); }\n  .c-vtl-title { font-size: 14px; font-weight: 500; color: var(--text-heading); }\n  .c-vtl-desc { font-size: 12.5px; color: var(--text-sub); line-height: 1.5; margin-top: 2px; }\n\n  /* Gantt */\n  .c-gantt-wrap { border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; margin-top: 12px; }\n  .c-gantt-head { display: grid; background: rgba(0,0,0,0.03); border-bottom: 1px solid var(--card-border); }\n  .c-gantt-th { padding: 8px 12px; font-family: var(--mono); font-size: 10.5px; color: var(--badge-color); }\n  .c-gantt-th.tc { text-align: center; border-left: 1px solid var(--card-border); }\n  .c-gantt-row { display: grid; border-bottom: 1px solid var(--card-border); align-items: center; }\n  .c-gantt-row:last-child { border-bottom: none; }\n  .c-gantt-label { padding: 10px 12px; font-size: 12.5px; color: var(--text-sub); border-right: 1px solid var(--card-border); }\n  .c-gantt-track { position: relative; height: 36px; }\n  .c-gantt-bar { position: absolute; top: 7px; height: 22px; border-radius: 4px; background: var(--node-bg); border: 1.2px solid var(--badge-color); display: flex; align-items: center; padding: 0 8px; font-family: var(--mono); font-size: 9.5px; color: var(--text-heading); white-space: nowrap; }\n\n  /* Canvas SVG */\n  .c-canvas svg { width: 100%; height: auto; display: block; margin-top: 10px; }\n\n  /* ================= \u5370\u5237\uff08\u30da\u30fc\u30b8\u5358\u4f4d\u306e\u51fa\u529b\uff09 ================= */\n  @page{ size:A5 portrait; margin:16mm 14mm; }\n  @media print{\n    html,body,body.vertical{\n      height:auto!important; overflow:visible!important;\n      scroll-behavior:auto;\n    }\n    html:not(.paper-mode),html:not(.paper-mode) body{ background:#fff!important; }\n    /* \u8868\u7d19\u30fb\u76ee\u6b21\u30fb\u5965\u4ed8\u306f\u305d\u308c\u305e\u308c\u72ec\u7acb\u3057\u305f\u30da\u30fc\u30b8\u306b */\n    .cover{ break-after:page; page-break-after:always; }\n    .toc{ break-after:page; page-break-after:always; break-inside:avoid; }\n    .colophon{ break-before:page; page-break-before:always; }\n    /* \u7ae0\u306f\u5fc5\u305a\u6539\u30da\u30fc\u30b8\u304b\u3089\u59cb\u3081\u308b\uff08\u524d\u4ed8\u3092\u9664\u304f\uff09 */\n    section.movement{ break-before:page; page-break-before:always; }\n    section.movement.frontmatter{ break-before:auto; page-break-before:auto; }\n    .divider{ break-after:avoid; page-break-after:avoid; }\n    /* \u56f3\u7248\u30fb\u30b3\u30fc\u30c9\u30fb\u30ab\u30fc\u30c9\u306f\u5206\u65ad\u3057\u306a\u3044 */\n    .code,figure,.fig-card,.c-figure-card,.outline .card,.draftnote .box{\n      break-inside:avoid; page-break-inside:avoid;\n    }\n    /* \u6bb5\u843d\u306e\u5b64\u7acb\u884c\u30fb\u5be1\u5a66\u884c\u3092\u6291\u3048\u308b */\n    .prose p{ orphans:2; widows:2; }\n    .prose h3{ break-after:avoid; page-break-after:avoid; }\n    /* \u753b\u9762\u7528\u306e\u88c5\u98fe\u3092\u843d\u3068\u3059 */\n    .pager{ display:none!important; }\n    body.vertical{ writing-mode:vertical-rl; }\n    body.vertical .cover,body.vertical .toc,\n    body.vertical .draftnote,body.vertical .colophon{ width:auto!important; height:auto!important; }\n    /* \u5370\u5237\u3067\u306f\u5224\u578b\u306b\u5408\u308f\u305b\u3066\u5e45\u3092\u6c7a\u3081\u308b\u3002\u30da\u30fc\u30b8\u5e45\u3092\u8d85\u3048\u308b\u3068\n       \u898b\u51fa\u3057\u304b\u3089\u5207\u308a\u96e2\u3055\u308c\u3066\u5358\u72ec\u30da\u30fc\u30b8\u306b\u8ffd\u3044\u51fa\u3055\u308c\u308b\u305f\u3081\u3002 */\n    body.vertical .code,body.vertical figure{\n      float:inline-start; clear:inline-start;\n      width:100%; max-width:100%;\n      height:fit-content; max-height:66%;\n      margin:0 0 1.2em 1.5em;\n      break-inside:avoid; page-break-inside:avoid;\n    }\n    body.vertical .prose::after,body.vertical .reading::after{ content:''; display:block; clear:both; }\n    html:not(.paper-mode) .c-figure-card{ box-shadow:none; border-color:#bbb; }\n    /* \u6fc3\u8272\u306e\u30b3\u30fc\u30c9\u30ab\u30fc\u30c9\u306f\u3001\u5370\u5237\u3067\u306f\u660e\u8272\u306b\u8ee2\u63db\u3059\u308b */\n    html:not(.paper-mode) .code{ background:#f4f2ec!important; border:1px solid #ccc; box-shadow:none; }\n    html:not(.paper-mode) .code .bar{ color:#5a5348; border-bottom-color:#ddd; }\n    html:not(.paper-mode) .code pre{ color:#1a2233; }\n    html:not(.paper-mode) .code .k{ color:#7a5c1e } html:not(.paper-mode) .code .s{ color:#3f5a44 } html:not(.paper-mode) .code .n{ color:#2e5170 }\n    html:not(.paper-mode) .code .p{ color:#6b6f78 } html:not(.paper-mode) .code .c{ color:#6b6f78;font-style:italic } html:not(.paper-mode) .code .f{ color:#2f5c52 }\n  }\n\n  /* ================= \u8868\u7d19\u306e\u7d0b\u7ae0 ================= */\n  .cover .emblem{\n    color:var(--gold);\n    width:clamp(104px,17vw,168px);\n    margin:0 auto 30px;\n    line-height:0;\n    animation:riseIn .9s cubic-bezier(.2,.7,.2,1) both;\n  }\n  .cover .emblem svg{ width:100%; height:auto; display:block; }\n  body.vertical .cover .emblem{ margin:0 0 0 34px; align-self:center; }\n  @media print{ .cover .emblem{ animation:none; } html:not(.paper-mode) .cover .emblem{ color:#8a6a2c; } }\n\n  /* ================= \u7d19\u9762\u30e2\u30fc\u30c9\uff1a\u7d19\u306e\u5f62\u3092\u3057\u305f\u67a0\u3067\u30da\u30fc\u30b8\u9001\u308a ================= */\n  html.paper-mode, html.paper-mode body{\n    height:100%; margin:0; overflow:hidden; background:#e7e3d8;\n  }\n  html.paper-mode body{\n    display:flex; align-items:center; justify-content:center;\n    writing-mode:horizontal-tb;\n  }\n  /* \u7d19\u305d\u306e\u3082\u306e\u3002\u4f59\u767d\u3092\u5185\u5074\u306b\u6301\u3064\u306e\u3067\u3001\u3069\u306e\u30da\u30fc\u30b8\u306b\u3082\u5929\u5730\u5c0f\u53e3\u306e\u4f59\u767d\u304c\u6b8b\u308b */\n  html.paper-mode .stage{\n    width:var(--paper-w); height:var(--paper-h);\n    padding:var(--mg-t) var(--mg-h) var(--mg-b);\n    box-sizing:border-box; position:relative;\n    background:var(--paper);\n    box-shadow:0 0 0 1px rgba(26,26,30,.10), 0 26px 64px rgba(14,22,38,.26);\n    overflow:hidden;\n    flex:none; transform-origin:center center;\n  }\n  /* \u672c\u6587\u304c\u6d41\u308c\u308b\u7a93\u3002\u3061\u3087\u3046\u3069\u7248\u9762\u306e\u5927\u304d\u3055 */\n  /* flow \u306f\u8997\u304d\u7a93\u3002\u4e2d\u306e reel \u3092\u5e73\u884c\u79fb\u52d5\u3057\u3066\u30da\u30fc\u30b8\u3092\u9001\u308b\u3002\n     \u7e26\u7d44\u307f\u306e\u30b9\u30af\u30ed\u30fc\u30eb\u306f\u63cf\u753b\u304c\u4e71\u308c\u308b\u3053\u3068\u304c\u3042\u308b\u305f\u3081\u3001\u30b9\u30af\u30ed\u30fc\u30eb\u3092\u4f7f\u308f\u306a\u3044\u3002 */\n  /* overflow:hidden \u306f\u3001\u4e2d\u8eab\u306b\u5909\u5f62\u304c\u639b\u304b\u3063\u3066\u3044\u308b\u3068\u5207\u308a\u53d6\u308a\u304c\u52b9\u304b\u306a\u3044\u74b0\u5883\u304c\u3042\u308b\u3002\n     clip-path \u3068 contain \u3092\u4f75\u7528\u3057\u3066\u78ba\u5b9f\u306b\u7a93\u306e\u5185\u5074\u3060\u3051\u3092\u898b\u305b\u308b\u3002 */\n  html.paper-mode .flow{\n    width:100%; height:100%;\n    margin:0 auto;\n    overflow:hidden;\n    clip-path:inset(0);\n    contain:paint;\n    position:relative;\n  }\n  /* \u4f4d\u7f6e\u305d\u306e\u3082\u306e\u3092\u52d5\u304b\u3059\u3002transform \u3067\u52d5\u304b\u3059\u3068\u72ec\u7acb\u3057\u305f\u63cf\u753b\u5c64\u306b\u306a\u308a\u3001\n     \u89aa\u306e\u5207\u308a\u53d6\u308a\u3092\u3059\u308a\u629c\u3051\u3066\u4f59\u767d\u306b\u6587\u5b57\u304c\u51fa\u308b\u74b0\u5883\u304c\u3042\u308b\u3002 */\n  html.paper-mode .reel{\n    height:100%;\n    position:absolute; top:0;\n    transition:right .42s cubic-bezier(.2,.7,.2,1), left .42s cubic-bezier(.2,.7,.2,1);\n  }\n  html.paper-mode body.vertical .reel{\n    writing-mode:vertical-rl; text-orientation:mixed;\n    right:0; width:max-content;\n  }\n  html.paper-mode body.vertical{ writing-mode:horizontal-tb; height:100%; margin:0; overflow:hidden; }\n\n  /* \u8868\u7d19\u3068\u5965\u4ed8\u306f\u7d19\u3044\u3063\u3071\u3044\u306e\u5225\u4e01\u3002\u7a93\u306e\u5916\u306b\u7f6e\u304d\u3001\u4f59\u767d\u306e\u5916\u307e\u3067\u5e83\u304c\u308b */\n  html.paper-mode .plate{\n    position:absolute; inset:0;\n    width:auto; height:auto; max-width:none; margin:0; padding:0; border:0;\n    display:flex; align-items:center; justify-content:center;\n    opacity:0; pointer-events:none;\n    transition:opacity .28s ease;\n    z-index:3;\n  }\n  html.paper-mode .plate.on{ opacity:1; pointer-events:auto; }\n  /* \u5225\u4e01\u306f\u672c\u6587\u306e\u6d41\u308c\u306e\u5916\u306b\u3042\u308b\u305f\u3081\u3001\u7e26\u66f8\u304d\u306e\u6307\u5b9a\u3092\u500b\u5225\u306b\u639b\u3051\u308b */\n  html.paper-mode body.vertical .plate{ writing-mode:vertical-rl; text-orientation:mixed; }\n  html.paper-mode body.vertical .plate.plate-yoko{ writing-mode:horizontal-tb; }\n  html.paper-mode body.vertical .plate .inner{ max-width:100%; max-height:100%; }\n  /* \u7e26\u7d44\u307f\u306e\u8868\u7d19\u3067\u306f\u3001\u7d0b\u7ae0\u3082\u884c\u65b9\u5411\u306e\u4e2d\u592e\u306b\u7f6e\u304f */\n  html.paper-mode body.vertical .plate .emblem{ margin-top:auto; margin-bottom:auto; }\n  /* \u7d19\u9762\u30e2\u30fc\u30c9\u3067\u306f\u3001\u8868\u7d19\u306e\u6587\u5b57\u306f\u753b\u9762\u5e45\u3067\u306f\u306a\u304f\u7d19\u306e\u5bf8\u6cd5\u3092\u57fa\u6e96\u306b\u3059\u308b\u3002\n     \u753b\u9762\u306e\u5e83\u3055\u3067\u521d\u671f\u30b5\u30a4\u30ba\u304c\u5909\u308f\u308b\u3068\u3001\u7e2e\u5c0f\u306e\u304b\u304b\u308a\u65b9\u304c\u5224\u578b\u3054\u3068\u306b\u63fa\u308c\u308b\u305f\u3081\u3002 */\n  html.paper-mode .cover h1{ font-size:calc(var(--paper-w) * 0.115); margin-bottom:.3em; }\n  html.paper-mode .cover .sub{ font-size:calc(var(--paper-w) * 0.042); }\n  html.paper-mode .cover .kicker{ font-size:calc(var(--paper-w) * 0.026); }\n  html.paper-mode .colophon .mark{ font-size:calc(var(--paper-w) * 0.055); }\n  html.paper-mode .cover .emblem{ width:calc(var(--paper-w) * 0.30); }\n  html.paper-mode .cover-plate{ background:linear-gradient(165deg,var(--night),var(--night-2)); }\n  html.paper-mode .colophon-plate{ background:linear-gradient(165deg,var(--night-2),var(--night)); }\n  /* \u7e26\u7d44\u307f\u3067\u306f flex \u306e\u4e3b\u8ef8\u3068\u4ea4\u5dee\u8ef8\u304c\u5165\u308c\u66ff\u308f\u308a\u3001\u4e2d\u592e\u63c3\u3048\u306e\u6307\u5b9a\u304c\u52b9\u304d\u306b\u304f\u3044\u3002\n     margin:auto \u306f\u66f8\u5b57\u65b9\u5411\u306b\u95a2\u4fc2\u306a\u304f\u4e21\u8ef8\u3067\u4e2d\u592e\u306b\u7f6e\u3051\u308b\u305f\u3081\u3001\u3053\u3061\u3089\u3092\u4f7f\u3046\u3002 */\n  html.paper-mode .plate .inner{\n    flex:0 0 auto;\n    max-width:100%; max-height:100%;\n    margin:auto;\n    padding:var(--mg-t) var(--mg-h) var(--mg-b);\n    box-sizing:border-box;\n  }\n\n  /* \u76ee\u6b21\u30fb\u8349\u7a3f\u30ce\u30fc\u30c8\u306f\u7248\u9762\u3044\u3063\u3071\u3044\u306e1\u30da\u30fc\u30b8 */\n  /* \u89aa(reel)\u306e\u5e45\u306f\u4e2d\u8eab\u6b21\u7b2c\u3067\u6c7a\u307e\u308b\u305f\u3081\u3001100%\u6307\u5b9a\u3067\u306f\u5e45\u304c\u5b9a\u307e\u3089\u306a\u3044\u3002\n     1\u30da\u30fc\u30b8\u3076\u3093\u306e\u5e45\u3092\u76f4\u63a5\u4e0e\u3048\u308b\u3002 */\n  html.paper-mode .toc,\n  html.paper-mode .draftnote{\n    max-width:none;\n    flex:none; box-sizing:border-box;\n    margin:0; padding:0; border:0;\n    display:flex; align-items:center; justify-content:safe center;\n  }\n  /* 一ページぶんに固定すると、章が多いとき中身があふれて次の章に重なる。\n     最小をページ一枚ぶんにして、収まらなければ枠のほうを伸ばす。\n     伸びる向きは組方向で変わる。縦組みは行が積まれる幅、横組みは深さ。 */\n  html.paper-mode body.vertical .toc,\n  html.paper-mode body.vertical .draftnote{\n    /* 画面いっぱい（100vw）のままだと、中身がその中で中央に寄ってしまい、\n       ページの頭から始まらない。枠は中身に合わせ、最小をページ一枚ぶんにする。 */\n    width:auto; min-width:var(--page-run); height:100%;\n    /* 見出しと一覧を、読み始め（縦組みでは右端）に揃える。中央寄せのままだと、\n       見出しが一覧の途中に置かれ、どこから始まるのか分からなくなる。 */\n    align-items:flex-start;\n  }\n  /* 横組みでは見出しと一覧が横に並んでしまう。縦に積んで、全体を天地の中央に置く。 */\n  html.paper-mode:not(.vertical) .toc,\n  html.paper-mode:not(.vertical) .draftnote{\n    width:100%; min-height:100%; flex-direction:column; align-items:stretch;\n    /* 中身が版面に収まらないときは、中央揃えだと上が切れて読めなくなる。\n       safe を付けると、収まらない場合だけ頭から始まる。 */\n    justify-content:safe center;\n  }\n\n  /* \u7248\u9762\u8a2d\u8a08\uff1a\u672c\u6587\u306e\u6587\u5b57\u30b5\u30a4\u30ba\u306f\u7d19\u304b\u3089\u9006\u7b97\u3057\u305f\u5024\u3092\u4f7f\u3046\u3002\n     \u753b\u9762\u7528\u306e\u5927\u304d\u3055\u3092\u305d\u306e\u307e\u307e\u5c0f\u3055\u306a\u7d19\u306b\u8f09\u305b\u308b\u3068\u30011\u30da\u30fc\u30b8\u306e\u884c\u6570\u304c\u6975\u7aef\u306b\u6e1b\u308b\u305f\u3081\u3002 */\n  html.paper-mode .prose{ font-size:var(--body-size); line-height:var(--line-adv); }\n  /* \u7a93\u3092\u884c\u9001\u308a\u306e\u6574\u6570\u500d\u306b\u305d\u308d\u3048\u308b\u3002\u7aef\u306b\u6b21\u306e\u884c\u304c\u8997\u304b\u306a\u3044\u3002 */\n  html.paper-mode body.vertical .flow{ width:var(--page-run); }\n  html.paper-mode:not(.vertical) .reel{ left:0; width:100%; column-count:1; column-gap:0; column-fill:auto; height:100%; }\n  html.paper-mode:not(.vertical) .flow{ height:var(--page-run); }\n  html.paper-mode .prose p{ margin-bottom:0; }\n  html.paper-mode .prose h3{ font-size:1.15em; margin:1.6em 0 .8em; line-height:1.6; }\n  html.paper-mode .lead-in{ font-size:1.05em; }\n  html.paper-mode body.vertical .prose p{ margin:0 0 0 1em; }\n  html.paper-mode body.vertical .prose h3{ margin:0 1.6em 0 .8em; }\n  html.paper-mode .divider h2{ font-size:calc(var(--body-size) * 2.1); }\n  html.paper-mode .divider .eyebrow{ font-size:calc(var(--body-size) * .62); }\n  html.paper-mode .toc{ font-size:var(--body-size); }\n  html.paper-mode .outline .card h4{ font-size:calc(var(--body-size) * 1.25); }\n  html.paper-mode .outline .card p{ font-size:var(--body-size); }\n  html.paper-mode .code pre{ font-size:calc(var(--body-size) * .88); }\n  html.paper-mode .book{ max-width:none; margin:0; padding:0; }\n  html.paper-mode .reading{ max-width:none; }\n  html.paper-mode .book::before{ display:none; }\n  html.paper-mode .divider .node{ display:none; }\n  /* :first-of-type \u3092\u542b\u3080\u6307\u5b9a\u306f\u8a73\u7d30\u5ea6\u304c\u9ad8\u304f padding:0 \u306b\u6253\u3061\u52dd\u3064\u305f\u3081\u3001\n     \u540c\u3058\u5f37\u3055\u306e\u6307\u5b9a\u3067\u660e\u793a\u7684\u306b\u6253\u3061\u6d88\u3059\uff08\u6700\u521d\u306e\u7bc0\u3060\u30518px\u305a\u308c\u308b\u539f\u56e0\u3060\u3063\u305f\uff09 */\n  html.paper-mode section.movement,\n  html.paper-mode body.vertical section.movement:first-of-type,\n  html.paper-mode section.movement:first-of-type{ padding:0; }\n  html.paper-mode body.vertical .book{ padding-top:0; }\n  html.paper-mode body.vertical .divider{ margin:0; }\n  html.paper-mode .pager{ bottom:14px; align-items:center; }\n  .pager .folio{\n    font-family:var(--mono); font-size:11px; letter-spacing:.12em;\n    color:var(--ink-dim); opacity:.7; min-width:56px; text-align:center; user-select:none;\n  }\n\n  /* \u6a2a\u7d44\u307f\u306f\u6bb5\u7d44\u307f\u30671\u6bb5\uff1d1\u30da\u30fc\u30b8 */\n  html.paper-mode:not(.vertical) .flow{\n    column-width:100%; column-gap:0; column-fill:auto;\n  }\n  html.paper-mode:not(.vertical) .toc,\n  html.paper-mode:not(.vertical) .draftnote{ break-after:column; }\n  html.paper-mode:not(.vertical) section.movement{ break-before:column; }\n  html.paper-mode:not(.vertical) section.movement.frontmatter{ break-before:avoid; }\n  /* \u8868\u306f\u30da\u30fc\u30b8\u3092\u307e\u305f\u304c\u306a\u3044\u3002\u5c0f\u898b\u51fa\u3057\u306f\u30da\u30fc\u30b8\u306e\u672b\u5c3e\u306b\u53d6\u308a\u6b8b\u3055\u306a\u3044\uff08\u7d9a\u304f\u672c\u6587\u3068\u540c\u3058\u6bb5\u306b\u9001\u308b\uff09\u3002\n     \u7e26\u7d44\u307f\u306f\u6bb5\u7d44\u307f\u3067\u306f\u306a\u3044\u306e\u3067\u3001\u540c\u3058\u3053\u3068\u3092\u7d44\u7248\u30b9\u30af\u30ea\u30d7\u30c8\u306e keepTogether \u3067\u884c\u3046\u3002 */\n  html.paper-mode:not(.vertical) .prose table{ break-inside:avoid; }\n  html.paper-mode:not(.vertical) .prose h3,html.paper-mode:not(.vertical) .prose h4{ break-after:avoid; }\n\n  /* \u5370\u5237\u6642\u306f\u67a0\u3092\u89e3\u9664\u3057\u3066\u3001\u30d6\u30e9\u30a6\u30b6\u672c\u6765\u306e\u30da\u30fc\u30b8\u5206\u5272\u306b\u4efb\u305b\u308b */\n  @media print{\n    html.paper-mode, html.paper-mode body{\n      height:auto!important; overflow:visible!important; background:#fff!important;\n      display:block!important;\n    }\n    html.paper-mode .stage{\n      width:auto!important; height:auto!important; padding:0!important;\n      box-shadow:none!important; overflow:visible!important; transform:none!important;\n      background:transparent!important; position:static!important;\n    }\n    html.paper-mode .flow{\n      width:auto!important; height:auto!important; padding:0!important; overflow:visible!important;\n      clip-path:none!important; contain:none!important;\n    }\n    html.paper-mode .reel{\n      position:static!important; transform:none!important; transition:none!important;\n      right:auto!important; left:auto!important;\n      height:auto!important; width:auto!important;\n      column-width:auto!important; columns:auto!important; will-change:auto;\n    }\n    html.paper-mode body.vertical .reel{ writing-mode:vertical-rl; }\n    html.paper-mode .plate{\n      position:static!important; opacity:1!important; display:block;\n      break-after:page; page-break-after:always;\n    }\n    html.paper-mode .colophon-plate{ break-before:page; page-break-before:always; break-after:auto; }\n    html.paper-mode .plate .inner{ padding:0!important; }\n    html.paper-mode .toc,html.paper-mode .draftnote{ height:auto; display:block; }\n    /* \u753b\u9762\u7528\u306e break-after:column \u3068 break-before:avoid \u304c\u5370\u5237\u306b\u3082\u52b9\u304f\u3068\u3001\u524d\u4ed8\u306e\u7ae0\u984c\u304c\u76ee\u6b21\u306e\u30da\u30fc\u30b8\u672b\u5c3e\u306b\u6b8b\u308b */\n    html.paper-mode:not(.vertical) section.movement.frontmatter{ break-before:auto; }\n    html.paper-mode:not(.vertical) .toc,html.paper-mode:not(.vertical) .draftnote{ break-after:page; page-break-after:always; }\n    .prose table{ break-inside:avoid; page-break-inside:avoid; }\n    .pager .folio{ display:none }\n  }\n";

/* 書き出す本に足すCSS。画像と脚注のぶん。
   BOOK_CSS を直接いじらずここに分けておくと、後から差分を追いやすい。
   縦組みでも効くように、上下左右ではなく論理方向（block/inline）で書く。 */
const ADDON_CSS = `
  /* ================= 画像 ================= */
  /* 大きさは4段階。効かせる軸は組方向で変わる。
     横組みは「段の幅に対する割合」、縦組みは図版が横組みの島になるので
     「行の長さ（＝画面の高さ）をどれだけ食うか」で決める。 */
  figure.photo      { --fig-w:100%; --fig-v:58vh; --fig-p:.60; }
  figure.photo.s-xs { --fig-w:24%;  --fig-v:15vh; --fig-p:.17; }
  figure.photo.s-s  { --fig-w:38%;  --fig-v:25vh; --fig-p:.28; }
  figure.photo.s-m  { --fig-w:62%;  --fig-v:39vh; --fig-p:.44; }
  figure.photo.s-l  { --fig-w:100%; --fig-v:58vh; --fig-p:.60; }

  figure.photo{ margin:2.1em auto; width:var(--fig-w); }
  figure.photo img{
    display:block; width:100%; height:auto;
    border:1px solid var(--line); border-radius:8px;
    background:var(--card);
    box-shadow:0 12px 30px rgba(14,22,38,.12);
  }

  /* 置き方。横組みは左右、縦組みは上下に回り込む。 */
  figure.photo.p-alone   { float:none;  clear:both;  margin:2.1em auto; }
  /* 回り込みでは、本文との左右の空きが天地より詰まって見える。
     字の並びに沿って読むぶん、横方向はゆるめに取る。 */
  figure.photo.p-wrap    { float:left;  clear:left;  margin:.35em 2.4em 1.4em 0; }
  figure.photo.p-wrap-end{ float:right; clear:right; margin:.35em 0 1.4em 2.4em; }
  /* 回り込ませた図版が節の外へはみ出さないように閉じる */
  .prose::after,.reading::after{ content:''; display:block; clear:both; }

  /* 段落の途中に置いた画像（アイコンなど）は行に馴染ませる */
  .prose p img{ max-width:100%; height:auto; vertical-align:middle; border-radius:4px; }
  .img-missing{
    display:block; padding:20px; border:1px dashed var(--line); border-radius:8px;
    background:rgba(194,167,107,.06); text-align:center;
    font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; color:var(--ink-dim);
  }

  /* --- 縦組み --- */
  /* 図版は横組みの島。既定は今までどおり行頭側（上）へ回り込ませる。
     大きさは画像そのものに上限を掛けて決める。枠を切ると絵が欠けるため。 */
  body.vertical figure.photo{
    writing-mode:horizontal-tb;
    float:inline-start; clear:inline-start;
    width:auto; height:fit-content; max-height:none;
    overflow:visible;
    margin:0 0 1.6em 1.9em;
  }
  body.vertical figure.photo img{
    width:auto; height:auto;
    max-width:min(520px,58vw);
    max-height:var(--fig-v);
  }
  body.vertical figure.photo.p-wrap    { float:inline-start; clear:inline-start; }
  body.vertical figure.photo.p-wrap-end{ float:inline-end;   clear:inline-end;   }
  body.vertical figure.photo.p-alone   { float:none; clear:both; }

  /* 紙面モードでは画面の高さではなく、組んだ行の長さを基準にする */
  html.paper-mode body.vertical figure.photo img{ max-height:calc(var(--page-run) * var(--fig-p)); }
  html.paper-mode figure.photo{ margin-block:1.4em; }

  /* 縦組みの紙面では、横組みの島（コード図版・図表・写真）がページより広いと
     必ずページをまたいで切れる。版面の幅で頭打ちにする。 */
  /* 版面いっぱいの島は、ページの頭からしか置けなくなり、手前に空きページを作りやすい。
     少し詰めておくと、そのページの残りに収まる場合が増える。
     別丁と天はページ単位の割り付けなので、いっぱいのままにする。 */
  html.paper-mode body.vertical .code,
  html.paper-mode body.vertical figure{ max-width:calc(var(--page-run) * 0.8); }
  html.paper-mode body.vertical figure.p-plate,
  html.paper-mode body.vertical figure.p-top{ max-width:var(--page-run); }
  html.paper-mode body.vertical figure.photo img{ max-width:var(--page-run); }
  /* 入れ子の図版に島の指定が二重にかかると、外側からはみ出して切れる。
     内側はふつうの塊として扱う。 */
  body.vertical figure figure,
  body.vertical figure .code{
    float:none; clear:none;
    width:auto; max-width:100%; height:auto; max-height:none;
    margin:0;
  }

  /* ページ揃えの詰め物。ページ送りの script が幅を決める。
     浮かせた図版を余白で押すと本文がその余白まで避けてしまうので、
     場所だけ取る空の塊を前に挿む。 */
  /* ページ揃えの部品。詰め物は場所だけ取る空の塊、目印は図版の元の位置。
     目印に clear を付けると、島の直後で本文の回り込みが打ち切られてしまう。 */
  .page-gap{ clear:both; float:none; margin:0; padding:0; border:0; }
  .fig-home{ display:block; width:0; height:0; overflow:hidden; }

  /* 紙面モードでは、島の影が隣のページへはみ出して見える。ページごとに
     切り取っているわけではないため。刷り物に影は要らないので落とす。 */
  html.paper-mode .reel .code,
  html.paper-mode .reel figure,
  html.paper-mode .reel figure img,
  html.paper-mode .reel figure > *{ box-shadow:none; }

  /* 箇条書きの行頭記号は、既定では枠の外側に描かれる。この本は余白を落としているので、
     記号が版面の外へ出てしまう。横組みでは前のページに侵入し、縦組みでは回り込みの
     島に乗る。横組みは内側に余白を確保し、縦組みは記号を行の中へ入れる。 */
  .prose ul,.prose ol{ padding-inline-start:1.6em; }
  body.vertical .prose ul,
  body.vertical .prose ol{ list-style-position:inside; padding-inline-start:1em; }
  body.vertical .prose li{ text-indent:0; }

  /* ---- ページ単位の割り付け ---- */
  /* 別丁：1ページを絵だけにする。天：ページの頭から決めた割合を絵にして、本文を下に流す。
     どちらもページの先頭から始まらないと意味がないので、
     紙面モードでは組み上がりを測って前に余白を足す（ページ送りの script 側）。 */
  figure.photo.p-top{ --top-f:.5; }
  figure.photo.f-13 { --top-f:.3333; }
  figure.photo.f-23 { --top-f:.6667; }

  figure.photo.p-plate,figure.photo.p-top{
    float:none; clear:both; width:100%; margin:2.6em auto;
  }
  figure.photo.p-plate img,figure.photo.p-top img{
    width:100%; height:auto; object-fit:contain;
    border:0; border-radius:2px; box-shadow:none; background:transparent;
  }
  figure.photo.p-plate img{ max-height:84vh; }
  figure.photo.p-top img{ max-height:50vh; }

  /* 紙面モード・横組み：段＝ページなので、段の頭から始めて深さを決める */
  html.paper-mode:not(.vertical) figure.photo.p-plate,
  html.paper-mode:not(.vertical) figure.photo.p-top{
    break-before:column; margin:0;
    display:flex; flex-direction:column; justify-content:center;
  }
  html.paper-mode:not(.vertical) figure.photo.p-plate{ height:var(--page-run); break-after:column; }
  html.paper-mode:not(.vertical) figure.photo.p-top{ height:calc(var(--page-run) * var(--top-f)); padding-bottom:1.4em; }
  html.paper-mode:not(.vertical) figure.photo.p-plate img,
  html.paper-mode:not(.vertical) figure.photo.p-top img{ height:100%; max-height:none; min-height:0; }

  /* 紙面モード・縦組み：ページ幅ぶんを占める。天は行の長さを割って使い、本文を下へ回す */
  html.paper-mode body.vertical figure.photo.p-plate,
  html.paper-mode body.vertical figure.photo.p-top{
    writing-mode:horizontal-tb;
    width:var(--page-run); margin:0; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
  }
  html.paper-mode body.vertical figure.photo.p-plate{ float:inline-start; clear:both; height:100%; }
  html.paper-mode body.vertical figure.photo.p-top{
    float:inline-start; clear:both;
    /* 説明文のすぐ下から本文が始まると窮屈なので、割り当てのなかから下に余白を取る。
       占める割合そのものは変えない。 */
    height:calc(100% * var(--top-f) - 1.2em);
    margin:0 0 1.2em 0;
    padding-left:1.4em;
  }
  html.paper-mode body.vertical figure.photo.p-plate img,
  html.paper-mode body.vertical figure.photo.p-top img{
    width:100%; height:100%; max-width:none; max-height:none; min-height:0;
  }

  /* ================= 脚注 ================= */
  .fn-ref{ font-family:var(--mono); font-weight:500; }
  .fn-ref a{
    color:var(--gold-deep); text-decoration:none;
    padding:0 .12em; border-radius:2px;
  }
  .fn-ref a:hover,.fn-ref a:focus-visible{ color:var(--ink-strong); background:rgba(194,167,107,.18); outline:none; }
  .footnotes{
    margin-block-start:2.8em; padding-block-start:1.2em;
    border-block-start:1px solid var(--line-soft);
    font-size:13.5px;
  }
  .footnotes .h{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold-deep); margin:0 0 1em;
  }
  .footnotes ol{ list-style:none; margin:0; padding:0; }
  .footnotes li{
    display:flex; gap:.75em;
    line-height:1.95; color:var(--ink-dim);
    margin-block-end:.6em;
  }
  .footnotes .num{
    font-family:var(--mono); font-size:.82em; color:var(--gold-deep);

  }
  .footnotes .body{ flex:1; }
  .footnotes .body em{ color:var(--gold-ink); font-style:normal; }
  .footnotes .body strong{ color:var(--ink-soft); font-weight:500; }
  .footnotes .back{ color:var(--gold-deep); text-decoration:none; margin-inline-start:.5em; opacity:.5; font-size:.85em; }
  .footnotes .back:hover,.footnotes .back:focus-visible{ opacity:1; outline:none; }
  .fn-missing{ color:#a8382a; }
  /* 縦組みでは番号だけ横に寝かせず、2桁は組数字にする */
  body.vertical .fn-ref,body.vertical .footnotes .num{ text-combine-upright:digits 2; }
  /* 縦組みでは、注の区切り罫がページの高さいっぱいの縦線になる。注が次のページへ
     送られると線だけが残って、意味の分からない罫に見える。短い印に替える。 */
  body.vertical .footnotes{
    margin-block-start:2.4em;
    border-block-start:0;
    background-image:linear-gradient(to bottom, var(--line-soft) 0, var(--line-soft) 5.5em, transparent 5.5em);
    background-repeat:no-repeat;
    background-size:1px 100%;
    background-position:right top;
  }

  /* 紙面モードでは、本文の文字サイズから逆算した大きさに揃える */
  html.paper-mode .footnotes{ font-size:calc(var(--body-size) * .84); }
  html.paper-mode .footnotes .h{ font-size:calc(var(--body-size) * .6); }

  /* ================= 表紙・奥付の画像 ================= */
  /* 全面に敷く写真。文字が読めなくなっては困るので、必ず幕を一枚かける。
     背景ではなく img 要素にしてあるのは、印刷にそのまま乗るため。
     表紙と奥付で同じ部品を使う。 */
  .cover,.colophon{ position:relative; overflow:hidden; }
  .bleed-img{
    position:absolute; inset:0; z-index:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center;
  }
  .pos-top .bleed-img{ object-position:center top; }
  .pos-bottom .bleed-img{ object-position:center bottom; }
  .bleed-veil{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(168deg, rgba(14,22,38,var(--veil-a)) 0%, rgba(11,18,32,var(--veil-b)) 100%);
  }
  .veil-light  { --veil-a:.28; --veil-b:.60; }
  .veil-normal { --veil-a:.54; --veil-b:.84; }
  .veil-dark   { --veil-a:.78; --veil-b:.95; }
  .cover .inner,.colophon .inner{ position:relative; z-index:2; }

  /* 図案の大きさ。基準の幅に倍率を掛ける。紋章でも画像でも同じように効かせる。 */
  .cover,.colophon{ --mk-k:1; }
  .mk-s { --mk-k:.62; }
  .mk-l { --mk-k:1.45; }
  .mk-xl{ --mk-k:2.1; }
  .cover .emblem{ width:calc(clamp(104px,17vw,168px) * var(--mk-k)); }
  html.paper-mode .cover .emblem{ width:calc(var(--paper-w) * 0.30 * var(--mk-k)); }

  /* 紋章の位置に置く図案。奥付は版元マークや近影の想定なので、表紙より控えめに取る。 */
  .mark-figure{ line-height:0; }
  .mark-figure img{ display:block; width:100%; height:auto; border-radius:6px; }
  .cover .mark-figure{ width:calc(clamp(120px,26vw,240px) * var(--mk-k)); margin:0 auto 30px; }
  .colophon .mark-figure{ width:calc(clamp(84px,16vw,132px) * var(--mk-k)); margin:0 auto 24px; }
  body.vertical .cover .mark-figure{ margin:0 0 0 34px; }
  body.vertical .colophon .mark-figure{ margin:0 0 0 26px; }
  html.paper-mode .cover .mark-figure{ width:calc(var(--paper-w) * 0.42 * var(--mk-k)); margin-bottom:.5em; }
  html.paper-mode .colophon .mark-figure{ width:calc(var(--paper-w) * 0.22 * var(--mk-k)); margin-bottom:.5em; }

  @media print{
    .footnotes .back{ display:none; }
    html:not(.paper-mode) figure.photo img{ box-shadow:none; border-color:#ccc; }
    .footnotes{ break-inside:avoid; page-break-inside:avoid; }
    /* 別丁と天は、紙のページの頭から始める */
    figure.photo.p-plate{ break-before:page; page-break-before:always; break-after:page; page-break-after:always; }
    figure.photo.p-top{ break-before:page; page-break-before:always; }
    figure.photo.p-plate img{ max-height:88vh; }
    figure.photo.p-top img{ max-height:calc(88vh * var(--top-f)); }
    /* 「画面で読む」仕上げでは印刷を白地に落とす方針なので、写真も伏せる */
    html:not(.paper-mode) .bleed-img,
    html:not(.paper-mode) .bleed-veil{ display:none; }
    /* 「紙面に合わせる」仕上げでは、幕まで刷る */
    html.paper-mode .bleed-veil{ print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  }
`;

const DB_NAME = 'CompositorDB', STORE = 'books';
let db = null, books = {}, currentBookId = null, currentChapterId = null, previewMode = 'chapter', pvTimer = null;

const uid = (p) => p + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ============ DB ============ */
function initDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => { const d = e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror = rej;
  });
}
function loadAll(){
  return new Promise(res => {
    books = {};
    const req = db.transaction([STORE],'readonly').objectStore(STORE).openCursor();
    req.onsuccess = e => { const c = e.target.result; if(c){ books[c.key] = c.value; c.continue(); } else res(); };
    req.onerror = () => res();
  });
}
function saveBook(b){ if(!db||!b) return; b.updatedAt = Date.now(); db.transaction([STORE],'readwrite').objectStore(STORE).put(b, b.id); }
function persist(){ saveBook(getBook()); schedulePreview(); }

const getBook = () => books[currentBookId] || null;
const getChapter = () => { const b = getBook(); return b ? (b.chapters.find(c => c.id === currentChapterId) || null) : null; };

/* ============ モデル ============ */
function newBook(title){
  return {
    id: uid('book'), title: title || '新しい本', subtitle: '', kicker: '技術同人誌 · 草稿',
    direction: 'horizontal', paperSize: 'A5', viewMode: 'screen',
    coverDirection: 'follow',
    coverEmblem: 'orbit', coverArt: '',
    coverImage: '', coverBg: '', coverVeil: 'normal', coverBgPos: 'center',
    coloImage: '', coloBg: '', coloVeil: 'normal', coloBgPos: 'center',
    coverMarkSize: 'm', coloMarkSize: 'm',
    provisional: '', series: '', volume: '', version: 'v0.1', year: String(new Date().getFullYear()),
    thesisA: '', thesisB: '', thesisDerive: '',
    draftnoteTitle: 'この草稿について', draftnote: '',
    closingMark: '', credit: '',
    chapters: [], images: {}, updatedAt: Date.now()
  };
}
function newChapter(kind){
  const labels = { front:'はじめに', body:'新しい章', back:'おわりに' };
  return { id: uid('ch'), kind: kind, eyebrow: '', title: labels[kind] || '新しい章', status: 'plan', summary: '', blocks: [] };
}
function newBlock(type){
  const b = { id: uid('blk'), type: type };
  if(type === 'prose') b.text = '';
  if(type === 'lead') b.text = '';
  if(type === 'code'){ b.label = 'event · Example'; b.lang = 'json'; b.code = ''; }
  if(type === 'figure'){ b.svg = ''; b.caption = ''; }
  if(type === 'diagram'){ b.json = ''; b.caption = ''; b.request = ''; }
  return b;
}

/* ============ 画像 ============
   画像は本の持ち物として book.images に置く。
     book.images["foo.png"] = { mime, data(base64), size, w, h }
   本文からは images/foo.png と、ふつうの相対パスで参照する。
   プロジェクトzipでは images/ フォルダの実ファイルになり、
   本を書き出すときだけ data URL に展開して1枚のHTMLに畳み込む。 */

const IMG_MIME = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
                   webp:'image/webp', svg:'image/svg+xml', avif:'image/avif', bmp:'image/bmp' };
const IMG_MAX_EDGE = 1800;          // 長辺がこれを超えたら縮める
const IMG_SOFT_LIMIT = 900 * 1024;  // これより重ければ、縮まなくても再エンコードを試す

const imgExt  = (name) => (String(name).match(/\.([A-Za-z0-9]+)$/) || ['',''])[1].toLowerCase();
const imgMime = (name) => IMG_MIME[imgExt(name)] || 'image/png';
const imgDataUrl = (rec) => 'data:' + (rec.mime || 'image/png') + ';base64,' + rec.data;

function bytesToBase64(bytes){
  let s = '';
  const CH = 0x8000;  // まとめて渡すと引数が多すぎて落ちるので刻む
  for(let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}
function base64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function humanSize(n){
  if(!n) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

/* Markdown のリンクやURLで困る文字を落とす。日本語はそのまま残す。 */
function sanitizeImageName(name){
  const raw = String(name || 'image.png').normalize('NFC');
  const m = raw.match(/^(.*?)(\.[A-Za-z0-9]+)?$/);
  let base = (m[1] || 'image').replace(/[\/\\:*?"'<>|#%&;\s()\[\]]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  if(!base) base = 'image';
  return base.slice(0, 48) + ((m[2] || '.png').toLowerCase());
}
function uniqueImageName(name, images){
  if(!images[name]) return name;
  const i = name.lastIndexOf('.');
  const base = i > 0 ? name.slice(0, i) : name, ext = i > 0 ? name.slice(i) : '';
  let n = 2;
  while(images[base + '-' + n + ext]) n++;
  return base + '-' + n + ext;
}

/* 写真は大きいまま抱えるとバックアップも書き出しも重くなるので、長辺で頭打ちにする。
   GIF（動く）と SVG（線画）は、変換すると壊れるのでそのまま持つ。 */
async function fileToImageRecord(file){
  const mime = file.type || imgMime(file.name);
  const buf = new Uint8Array(await file.arrayBuffer());
  const asIs = { mime: mime, data: bytesToBase64(buf), size: buf.length, w: 0, h: 0 };
  if(mime === 'image/svg+xml' || mime === 'image/gif') return asIs;

  let bmp = null;
  try{ bmp = await createImageBitmap(new Blob([buf], { type: mime })); }
  catch(e){ return asIs; }
  asIs.w = bmp.width; asIs.h = bmp.height;

  const long = Math.max(bmp.width, bmp.height);
  const shrink = long > IMG_MAX_EDGE;
  if(!shrink && buf.length <= IMG_SOFT_LIMIT){ if(bmp.close) bmp.close(); return asIs; }

  const scale = shrink ? IMG_MAX_EDGE / long : 1;
  const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if(bmp.close) bmp.close();

  const outMime = (mime === 'image/jpeg' || mime === 'image/webp') ? mime : 'image/png';
  const blob = await new Promise(r => cv.toBlob(r, outMime, .9));
  if(!blob || blob.size >= buf.length) return asIs;   // 小さくならないなら元のまま
  const nb = new Uint8Array(await blob.arrayBuffer());
  return { mime: outMime, data: bytesToBase64(nb), size: nb.length, w: w, h: h };
}

/* zip やバックアップから来た画像には寸法が入っていない。
   読み込んだあとで測っておくと、書き出した本の組み版が読み込み中にずれない。 */
async function backfillImageSizes(book){
  const imgs = (book && book.images) || {};
  const names = Object.keys(imgs).filter(n => !imgs[n].w && imgs[n].mime !== 'image/svg+xml');
  if(!names.length) return;
  for(const n of names){
    try{
      const bmp = await createImageBitmap(new Blob([base64ToBytes(imgs[n].data)], { type: imgs[n].mime }));
      imgs[n].w = bmp.width; imgs[n].h = bmp.height;
      if(bmp.close) bmp.close();
    }catch(e){ /* 測れない形式はそのままでよい */ }
  }
  saveBook(book); schedulePreview();
}

async function addImageFiles(files){
  const book = getBook(); if(!book) return [];
  if(!book.images) book.images = {};
  const added = [], skipped = [];
  for(const f of Array.from(files || [])){
    if(!/^image\//.test(f.type || imgMime(f.name))){ skipped.push(f.name); continue; }
    try{
      const name = uniqueImageName(sanitizeImageName(f.name), book.images);
      book.images[name] = await fileToImageRecord(f);
      added.push(name);
    }catch(e){ skipped.push(f.name); }
  }
  if(added.length){ persist(); updateImageCount(); }
  if(skipped.length) toast('読み込めませんでした: ' + skipped.join(', '));
  return added;
}

const imageMarkdown = (name) => '![](images/' + name + ')';

/* 「(images/名前)」と「(images/名前 "小")」の両方を拾う */
const imgRefRe = (name) => new RegExp('\\(images/' + String(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|\\))', 'g');

/* 表紙や奥付で使っているぶんも数に入れないと「未使用」と誤って表示され、
   消してよいものだと思わせてしまう。 */
const PLATE_IMAGE_FIELDS = [
  ['coverImage','表紙'], ['coverBg','表紙'],
  ['coloImage','奥付'],  ['coloBg','奥付']
];
const PLATE_IMAGE_KEYS = PLATE_IMAGE_FIELDS.map(f => f[0]);

/* 参照している欄の数 */
function plateRefs(book, name){
  return PLATE_IMAGE_KEYS.filter(k => (book[k] || '') === name).length;
}
/* 知らせに使う場所の名前。同じ面で2つ使っていても「表紙」は一度だけ。 */
function plateWhere(book, name){
  const out = [];
  PLATE_IMAGE_FIELDS.forEach(([k, label]) => {
    if((book[k] || '') === name && out.indexOf(label) < 0) out.push(label);
  });
  return out;
}
function imageUsage(book, name){
  let n = plateRefs(book, name);
  (book.chapters || []).forEach(ch => (ch.blocks || []).forEach(b => {
    if(b.type !== 'prose' || !b.text) return;
    const m = b.text.match(imgRefRe(name));
    if(m) n += m.length;
  }));
  return n;
}
function renameImage(book, from, to){
  if(!book.images[from] || from === to) return false;
  if(book.images[to]) return false;
  book.images[to] = book.images[from];
  delete book.images[from];
  PLATE_IMAGE_KEYS.forEach(k => { if(book[k] === from) book[k] = to; });
  (book.chapters || []).forEach(ch => (ch.blocks || []).forEach(b => {
    if(b.type === 'prose' && b.text) b.text = b.text.replace(imgRefRe(from), '(images/' + to + '$1');
  }));
  return true;
}

/* ============ 章番号・ID ============ */
function bodyNumber(book, ch){
  let n = 0;
  for(const c of book.chapters){ if(c.kind === 'body'){ n++; if(c.id === ch.id) return n; } }
  return null;
}
function sectionId(book, ch){
  const idx = book.chapters.filter(c => c.kind === ch.kind).indexOf(ch);
  if(ch.kind === 'body') return 'ch' + bodyNumber(book, ch);
  const base = ch.kind === 'front' ? 'intro' : 'outro';
  return idx === 0 ? base : base + (idx + 1);
}
/* 目次の番号。章に見出しの上の小さなラベル（例：第1原則）があれば、それを使う */
function tocLabel(book, ch){ return ch.eyebrow ? esc(ch.eyebrow) : tocNumber(book, ch); }
function tocNumber(book, ch){ return ch.kind === 'body' ? '第 ' + bodyNumber(book, ch) + ' 章' : '—'; }
function autoEyebrow(book, ch){
  if(ch.eyebrow && ch.eyebrow.trim()) return ch.eyebrow.trim();
  if(ch.kind === 'front') return 'Preface';
  if(ch.kind === 'back') return 'Afterword';
  const n = bodyNumber(book, ch);
  return 'Chapter ' + String(n).padStart(2, '0');
}

/* ============ 脚注 ============
   本文中の書き方は2通り。
     [^ラベル]  … 章内のどこかに「[^ラベル]: 内容」を書いておく
     ^[その場に書く注]  … ラベルを考えたくないとき
   番号は章ごとに、本文に出てきた順で自動で振り直す。
   注そのものは章の末尾にまとめる。ページ下部に置くのは、
   段組みや縦組みと両立しないので採らない。 */

/* コード（``` の囲みと `インライン`）の中は書き換えない。
   [en] や == の置換も、これまでコード内まで効いていたので合わせて通す。 */
function mapOutsideCode(md, fn){
  const re = /(^[ \t]{0,3}(`{3,}|~{3,})[^\n]*\n[\s\S]*?^[ \t]{0,3}\2[^\n]*$|`+[^`\n]*`+)/gm;
  let out = '', last = 0, m;
  while((m = re.exec(md)) !== null){
    out += fn(md.slice(last, m.index)) + m[0];
    last = m.index + m[0].length;
    if(re.lastIndex === m.index) re.lastIndex++;
  }
  return out + fn(md.slice(last));
}

/* 「[^ラベル]: 内容」の行を本文から抜き取る。
   続きを書きたいときは、次の行を字下げする。 */
function stripFootnoteDefs(text){
  const defs = {};
  const keep = [];
  let cur = null;
  String(text || '').replace(/\r\n/g, '\n').split('\n').forEach(line => {
    const m = line.match(/^\[\^([^\]\s]+)\]:[ \t]*(.*)$/);
    if(m){ cur = m[1]; defs[cur] = m[2]; return; }
    if(cur !== null && /^[ \t]+\S/.test(line)){ defs[cur] += ' ' + line.trim(); return; }
    cur = null;
    keep.push(line);
  });
  // trim() は全角スペースまで削るので使えない。段落頭の字下げが消えてしまう。
  // 前後の空行だけを落とす。
  return { text: keep.join('\n').replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, ''), defs };
}

/* 章ひとつぶんの下ごしらえ。定義を先に集めてから本文を描く。
   定義を本文より前に書いても後に書いても動くようにするため。 */
function prepareChapter(book, ch){
  const ctx = { key: sectionId(book, ch), defs:{}, bodies:{}, notes:[], byLabel:{}, subs:[] };
  (ch.blocks || []).forEach(b => {
    if(b.type !== 'prose') return;
    const r = stripFootnoteDefs(b.text || '');
    ctx.bodies[b.id] = r.text;
    for(const k in r.defs){ if(ctx.defs[k] === undefined) ctx.defs[k] = r.defs[k]; }
  });
  return ctx;
}

function fnMarker(ctx, label, inline){
  let n, first = true;
  if(label !== null && ctx.byLabel[label]){ n = ctx.byLabel[label]; first = false; }
  else{
    n = ctx.notes.length + 1;
    ctx.notes.push({ n: n, label: label, body: (label !== null) ? ctx.defs[label] : inline });
    if(label !== null) ctx.byLabel[label] = n;
  }
  const id = first ? ' id="fnref-' + ctx.key + '-' + n + '"' : '';
  ctx.subs.push('<sup class="fn-ref"' + id + '><a href="#fn-' + ctx.key + '-' + n + '">' + n + '</a></sup>');
  return '@@FN' + (ctx.subs.length - 1) + '@@';
}

function markFootnotes(md, ctx){
  if(!ctx) return md;
  // 2つの記法を1本の正規表現で拾う。別々に置換すると採番が本文の順とずれる。
  return mapOutsideCode(md, seg => seg.replace(
    /\^\[([^\]]+)\]|\[\^([^\]\s]+)\]/g,
    (m, inline, label) => (inline !== undefined) ? fnMarker(ctx, null, inline) : fnMarker(ctx, label, null)
  ));
}

function footnotesHtml(ctx){
  if(!ctx || !ctx.notes.length) return '';
  const items = ctx.notes.map(nt => {
    const body = (nt.body === undefined || nt.body === null || String(nt.body).trim() === '')
      ? '<span class="fn-missing">注の中身がありません（[^' + esc(String(nt.label)) + ']: を書いてください）</span>'
      : renderInline(String(nt.body));
    return '<li id="fn-' + ctx.key + '-' + nt.n + '">' +
      '<span class="num">' + nt.n + '</span>' +
      '<span class="body">' + body +
      '<a class="back" href="#fnref-' + ctx.key + '-' + nt.n + '" aria-label="本文に戻る">\u21a9</a>' +
      '</span></li>';
  }).join('\n');
  return '<div class="footnotes reading">\n<p class="h">注</p>\n<ol>\n' + items + '\n</ol>\n</div>';
}

/* ============ Markdown → 組版HTML ============ */
/* CommonMark は「**」の内側が約物で始まる／終わると強調と認めない。
   **「紙面に合わせる」** のような和文でよく書く形が素通りしてしまうので、
   [en] や == と同じように自前で置き換える。 */
function decorate(t){
  return mapOutsideCode(t, s => s
    .replace(/\[en\]([\s\S]*?)\[\/en\]/g, '@@ENO@@$1@@ENC@@')
    .replace(/==([\s\S]*?)==/g, '@@MKO@@$1@@MKC@@')
    .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, '@@STO@@@@EMO@@$1@@EMC@@@@STC@@')
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '@@STO@@$1@@STC@@')
    .replace(/\*(?=\S)([^*\n]*?\S)\*/g, '@@EMO@@$1@@EMC@@'));
}
function undecorate(html){
  return html.replace(/@@ENO@@/g, '<span class="en">').replace(/@@ENC@@/g, '</span>')
             .replace(/@@MKO@@/g, '<span class="mark">').replace(/@@MKC@@/g, '</span>')
             .replace(/@@STO@@/g, '<strong>').replace(/@@STC@@/g, '</strong>')
             .replace(/@@EMO@@/g, '<em>').replace(/@@EMC@@/g, '</em>');
}
function renderInline(md){ return undecorate(marked.parseInline(decorate(String(md)))); }

/* 画像だけの段落は図版として組む。
   ![説明](images/foo.png "s wrap") のように、うしろへ大きさと置き方を添えられる。
   日本語で書いても通るようにしてある（手で書くときのため）。 */
const FIG_SIZE = {
  xs:'s-xs', '極小':'s-xs',
  s:'s-s', small:'s-s', '小':'s-s',
  m:'s-m', medium:'s-m', '中':'s-m',
  l:'s-l', large:'s-l', '大':'s-l', full:'s-l', '全幅':'s-l'
};
const FIG_PLACE = {
  alone:'p-alone', '単独':'p-alone',
  wrap:'p-wrap', '回り込み':'p-wrap',
  'wrap-end':'p-wrap-end', '回り込み逆':'p-wrap-end',
  plate:'p-plate', '別丁':'p-plate',
  top:'p-top', '天':'p-top', 'top-1-2':'p-top', '天半分':'p-top',
  'top-1-3':'p-top f-13', '天三分の一':'p-top f-13',
  'top-2-3':'p-top f-23', '天三分の二':'p-top f-23'
};
function figureClasses(title){
  const out = [];
  String(title || '').split(/[\s,、]+/).filter(Boolean).forEach(word => {
    const hit = FIG_SIZE[word] || FIG_SIZE[word.toLowerCase()] || FIG_PLACE[word] || FIG_PLACE[word.toLowerCase()];
    // 天の割合のように、1語が2つの組を指すことがある
    if(hit) hit.split(' ').forEach(c => { if(out.indexOf(c) < 0) out.push(c); });
  });
  return out;
}
function imageParagraphsToFigures(html){
  return html.replace(/<p>\s*(<img\b[^>]*>)\s*<\/p>/g, (m, img) => {
    const alt = (img.match(/\balt="([^"]*)"/) || ['',''])[1];
    const title = (img.match(/\btitle="([^"]*)"/) || ['',''])[1];
    const cls = ['photo'].concat(figureClasses(title)).join(' ');
    const cap = alt ? '<figcaption>' + alt + '</figcaption>' : '';
    return '<figure class="' + cls + '">' + img.replace(/\s*\btitle="[^"]*"/, '') + cap + '</figure>';
  });
}

function renderProse(md, ctx){
  if(!md || !md.trim()) return '';
  let html = marked.parse(decorate(markFootnotes(md, ctx)));
  html = html.replace(/<h[1-6]([^>]*)>/g, '<h3$1>').replace(/<\/h[1-6]>/g, '</h3>');
  html = undecorate(html);
  if(ctx) html = html.replace(/@@FN(\d+)@@/g, (m, i) => ctx.subs[+i] || '');
  return imageParagraphsToFigures(html);
}

/* images/… の参照を、書き出し時に実体（data URL）へ差し替える。
   本は1枚のHTMLで完結させたいので、外部ファイルへは逃がさない。 */
function resolveImages(html, book){
  const images = (book && book.images) || {};
  return html.replace(/<img\b[^>]*\bsrc="images\/([^"]*)"[^>]*>/g, (tag, name) => {
    let key = name;
    try{ key = decodeURIComponent(name); }catch(e){}
    const rec = images[key] || images[name];
    if(!rec) return '<span class="img-missing">画像が見つかりません: ' + esc(key) + '</span>';
    // タグを組み直すと属性の並びや説明文の空白が変わってしまうので、src だけ差し替える
    const url = imgDataUrl(rec);
    let out = tag.replace('src="images/' + name + '"', () => 'src="' + url + '"');
    if(rec.w && rec.h) out = out.replace(/\s*\/?>$/, ' width="' + rec.w + '" height="' + rec.h + '">');
    return out;
  });
}

/* ============ コード自動色分け ============ */
function tokenizeJson(src){
  let out = '', i = 0;
  const re = /("(?:[^"\\]|\\.)*")|(-?\d+(?:\.\d+)?)|(\btrue\b|\bfalse\b|\bnull\b)|([{}\[\],:])/g;
  let m;
  while((m = re.exec(src)) !== null){
    out += esc(src.slice(i, m.index));
    if(m[1]){
      const after = src.slice(m.index + m[1].length).match(/^\s*:/);
      out += '<span class="' + (after ? 'k' : 's') + '">' + esc(m[1]) + '</span>';
    } else if(m[2] || m[3]){
      out += '<span class="n">' + esc(m[0]) + '</span>';
    } else {
      out += '<span class="p">' + esc(m[4]) + '</span>';
    }
    i = m.index + m[0].length;
  }
  return out + esc(src.slice(i));
}
function tokenizeYaml(src){
  return src.split('\n').map(line => {
    const kv = line.match(/^(\s*)([A-Za-z0-9_.\-]+)(:)(.*)$/);
    if(kv){
      let val = kv[4];
      const v = val.trim();
      let vHtml;
      if(!v) vHtml = esc(val);
      else if(/^(-?\d+(\.\d+)?|true|false|null)$/.test(v)) vHtml = esc(val).replace(esc(v), '<span class="n">' + esc(v) + '</span>');
      else vHtml = esc(val);
      return kv[1] + '<span class="k">' + esc(kv[2]) + '</span><span class="p">:</span>' + vHtml;
    }
    const li = line.match(/^(\s*)(-)(\s+.*)$/);
    if(li) return li[1] + '<span class="p">-</span>' + esc(li[3]);
    return esc(line);
  }).join('\n');
}
