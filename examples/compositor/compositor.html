/* ============ zip の読み書き（外部ライブラリなし） ============
   ブラウザ標準の CompressionStream / DecompressionStream を使う。
   Safari はフォルダを直接書けないため、受け渡しは zip 一択になる。 */

const ZIP_SIG_LOCAL = 0x04034b50;
const ZIP_SIG_CDIR  = 0x02014b50;
const ZIP_SIG_END   = 0x06054b50;

/* CRC32（zip の整合性検査に必須） */
let CRC_TABLE = null;
function crc32(buf){
  if(!CRC_TABLE){
    CRC_TABLE = new Uint32Array(256);
    for(let i=0;i<256;i++){
      let c=i;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i]=c>>>0;
    }
  }
  let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function deflateRaw(bytes){
  if(typeof CompressionStream === 'undefined') return null;
  try{
    const cs = new CompressionStream('deflate-raw');
    const out = new Response(new Blob([bytes]).stream().pipeThrough(cs));
    return new Uint8Array(await out.arrayBuffer());
  }catch(e){ return null; }
}
async function inflateRaw(bytes){
  const ds = new DecompressionStream('deflate-raw');
  const out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await out.arrayBuffer());
}

/* files: { "path/name": Uint8Array | string } -> Blob */
async function zipWrite(files){
  const enc = new TextEncoder();
  const names = Object.keys(files);
  const chunks = [], central = [];
  let offset = 0;

  for(const name of names){
    const raw = files[name];
    const data = (typeof raw === 'string') ? enc.encode(raw) : raw;
    const nameBytes = enc.encode(name);
    const crc = crc32(data);

    let method = 0, body = data;
    const packed = await deflateRaw(data);
    if(packed && packed.length < data.length){ method = 8; body = packed; }

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, ZIP_SIG_LOCAL, true);
    lv.setUint16(4, 20, true);          // version needed
    lv.setUint16(6, 0, true);           // flags
    lv.setUint16(8, method, true);
    lv.setUint16(10, 0, true);          // time
    lv.setUint16(12, 0, true);          // date
    lv.setUint32(14, crc, true);
    lv.setUint32(18, body.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);          // extra len
    local.set(nameBytes, 30);

    chunks.push(local, body);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, ZIP_SIG_CDIR, true);
    cv.setUint16(4, 20, true);          // version made by
    cv.setUint16(6, 20, true);          // version needed
    cv.setUint16(8, 0, true);
    cv.setUint16(10, method, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, body.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + body.length;
  }

  let centralSize = 0;
  for(const c of central) centralSize += c.length;

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, ZIP_SIG_END, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, names.length, true);
  ev.setUint16(10, names.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...chunks, ...central, end], { type: 'application/zip' });
}

/* ArrayBuffer -> { "path/name": Uint8Array } */
async function zipRead(buffer){
  const bytes = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  const dec = new TextDecoder();

  // 末尾から End of Central Directory を探す
  let end = -1;
  for(let i = bytes.length - 22; i >= 0 && i > bytes.length - 65558; i--){
    if(dv.getUint32(i, true) === ZIP_SIG_END){ end = i; break; }
  }
  if(end < 0) throw new Error('zip の終端が見つかりません');

  const count = dv.getUint16(end + 10, true);
  let p = dv.getUint32(end + 16, true);
  const out = {};

  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== ZIP_SIG_CDIR) break;
    const method   = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen  = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const cmtLen   = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));

    // ローカルヘッダから実データの位置を求める
    const lNameLen  = dv.getUint16(localOff + 26, true);
    const lExtraLen = dv.getUint16(localOff + 28, true);
    const dataStart = localOff + 30 + lNameLen + lExtraLen;
    const raw = bytes.subarray(dataStart, dataStart + compSize);

    if(!name.endsWith('/')){
      out[name] = (method === 8) ? await inflateRaw(raw) : raw.slice();
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

/* ============ 本 ⇄ ファイル群（git で扱える形） ============
   book.json は「並び順と書誌情報」だけを持ち、章の題名や状態は
   各 Markdown の front matter に置く。こうすると章を書き換えても
   触るファイルが1つで済み、複数人で書いても衝突しにくい。 */

const BOOK_FORMAT = 'compositor-book/1';

/* --- front matter --- */
function fmEncode(obj){
  const lines = ['---'];
  for(const k in obj){
    const v = obj[k];
    if(v === undefined || v === null || v === '') continue;
    const s = String(v);
    lines.push(k + ': ' + (/[:#\n]|^\s|\s$/.test(s) ? JSON.stringify(s) : s));
  }
  lines.push('---');
  return lines.join('\n');
}
function fmDecode(text){
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if(!m) return { meta:{}, body:text };
  const meta = {};
  m[1].split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':');
    if(i < 0) return;
    const k = line.slice(0, i).trim();
    let v = line.slice(i + 1).trim();
    if(v.startsWith('"')){ try{ v = JSON.parse(v); }catch(e){} }
    meta[k] = v;
  });
  return { meta, body: text.slice(m[0].length) };
}

/* --- ブロック ⇄ Markdown ---
   本文は素のまま、それ以外は囲みブロックにする。
   標準的な Markdown なので、他のエディタでもそのまま編集できる。 */
function fenceFor(text){
  let n = 3;
  const m = String(text || '').match(/^`{3,}/gm);
  if(m) m.forEach(f => { if(f.length >= n) n = f.length + 1; });
  return '`'.repeat(n);
}
function blocksToMarkdown(blocks){
  const parts = [];
  (blocks || []).forEach(b => {
    if(b.type === 'prose'){
      // trim() は全角スペースまで削るので、前後の空行だけを落とす
      parts.push((b.text || '').replace(/^\n+|\n+$/g, ''));
    } else if(b.type === 'lead'){
      const f = fenceFor(b.text);
      parts.push(f + 'lead\n' + (b.text || '').trim() + '\n' + f);
    } else if(b.type === 'code'){
      const f = fenceFor(b.code);
      const info = [b.lang || 'text', b.label || ''].join(' ').trim();
      parts.push(f + info + '\n' + (b.code || '') + '\n' + f);
    } else if(b.type === 'diagram'){
      const f = fenceFor(b.json);
      const head = (b.request ? '<!-- request: ' + String(b.request).replace(/--+>/g,'') + ' -->\n' : '');
      parts.push(head + f + ['diagram', b.caption || ''].join(' ').trim() + '\n' + (b.json || '') + '\n' + f);
    } else if(b.type === 'figure'){
      const f = fenceFor(b.svg);
      parts.push(f + ['svg', b.caption || ''].join(' ').trim() + '\n' + (b.svg || '') + '\n' + f);
    }
  });
  return parts.filter(s => s !== '').join('\n\n') + '\n';
}
function markdownToBlocks(md){
  const blocks = [];
  const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
  let buf = [], pendingRequest = '';
  const flushProse = () => {
    // 前後の空行だけを落とす。trim() だと段落頭の全角スペースまで消える。
    const text = buf.join('\n').replace(/^\n+|\n+$/g, '');
    buf = [];
    if(text.trim()) blocks.push({ id: uid('blk'), type: 'prose', text });
  };
  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    const req = line.match(/^<!--\s*request:\s*([\s\S]*?)\s*-->\s*$/);
    if(req){ pendingRequest = req[1]; continue; }
    const open = line.match(/^(`{3,})\s*(.*)$/);
    if(open){
      flushProse();
      const fence = open[1];
      const info = (open[2] || '').trim();
      const body = [];
      i++;
      while(i < lines.length && !new RegExp('^' + fence + '\\s*$').test(lines[i])){ body.push(lines[i]); i++; }
      const content = body.join('\n');
      const sp = info.indexOf(' ');
      const kind = sp < 0 ? info : info.slice(0, sp);
      const rest = sp < 0 ? '' : info.slice(sp + 1).trim();
      if(kind === 'lead'){
        blocks.push({ id: uid('blk'), type: 'lead', text: content.trim() });
      } else if(kind === 'diagram'){
        blocks.push({ id: uid('blk'), type: 'diagram', json: content, caption: rest, request: pendingRequest });
        pendingRequest = '';
      } else if(kind === 'svg'){
        blocks.push({ id: uid('blk'), type: 'figure', svg: content, caption: rest });
      } else {
        blocks.push({ id: uid('blk'), type: 'code', lang: kind || 'text', label: rest, code: content });
      }
      continue;
    }
    buf.push(line);
  }
  flushProse();
  return blocks;
}

/* --- ファイル名 --- */
function chapterFileName(ch, used){
  let base = String(ch.title || '無題').trim()
    .replace(/[\/\\:*?"<>|]/g, '_')
    .replace(/\s+/g, '_')
    .slice(0, 40) || '無題';
  let name = base + '.md', n = 2;
  while(used.has(name)){ name = base + '_' + n + '.md'; n++; }
  used.add(name);
  return name;
}

/* --- 本 → ファイル群 --- */
const BOOK_META_KEYS = ['title','subtitle','kicker','provisional','series','volume','version','year',
  'thesisA','thesisB','thesisDerive','draftnoteTitle','draftnote','closingMark','credit',
  'direction','paperSize','viewMode','coverDirection','coverEmblem','coverArt',
  'coverImage','coverBg','coverVeil','coverBgPos',
  'coloImage','coloBg','coloVeil','coloBgPos','coverMarkSize','coloMarkSize'];

function bookToFiles(book){
  const files = {};
  const meta = { format: BOOK_FORMAT };
  BOOK_META_KEYS.forEach(k => { if(book[k] !== undefined && book[k] !== '') meta[k] = book[k]; });

  const used = new Set();
  const order = [];
  (book.chapters || []).forEach(ch => {
    const file = (ch.file && !used.has(ch.file)) ? (used.add(ch.file), ch.file) : chapterFileName(ch, used);
    order.push(file);
    const fm = fmEncode({
      title: ch.title || '',
      kind: ch.kind || 'body',
      status: ch.status || 'draft',
      eyebrow: ch.eyebrow || '',
      summary: ch.status === 'plan' ? (ch.summary || '') : ''
    });
    const body = (ch.status === 'plan') ? '' : blocksToMarkdown(ch.blocks);
    files['chapters/' + file] = fm + '\n\n' + body;
  });
  meta.chapters = order;
  files['book.json'] = JSON.stringify(meta, null, 2) + '\n';

  // 画像は実ファイルとして出す。base64 のままだと差分が読めず、git が肥る。
  Object.keys(book.images || {}).forEach(name => {
    const rec = book.images[name];
    if(rec && rec.data) files['images/' + name] = base64ToBytes(rec.data);
  });

  files['README.md'] = [
    '# ' + String(book.title || '').replace(/\n/g, ' '),
    '',
    'Compositor で書かれた本のリポジトリです。',
    '',
    '- `book.json` … 書誌情報と章の並び順',
    '- `chapters/*.md` … 各章。冒頭の `---` に囲まれた部分が題名や状態',
    '- `images/` … 画像',
    '',
    '章を追加・並べ替えたときだけ `book.json` を触ります。',
    '本文を書き換えるときは、その章のファイルだけが変わります。',
    '',
    '## 本文の書き方',
    '',
    '### 画像',
    '',
    '```markdown',
    '![説明文](images/screenshot.png)',
    '```',
    '',
    '画像だけの段落は、説明文をキャプションにした図版として組まれます。',
    '大きさと置き方は、うしろの題名欄で指定します。',
    '',
    '```markdown',
    '![著者近影](images/me.png "s wrap-end")',
    '```',
    '',
    '| 語 | 意味 |',
    '| --- | --- |',
    '| `xs` `s` `m` `l` | 極小・小・中・大（既定は `l`） |',
    '| `alone` | 単独で置く（本文を回り込ませない） |',
    '| `wrap` | 起点側に回り込ませる（横組みは左、縦組みは上） |',
    '| `wrap-end` | 終点側に回り込ませる（横組みは右、縦組みは下） |',
    '| `plate` | 別丁。1ページを絵だけにする |',
    '| `top` `top-1-3` `top-2-3` | 天。ページの頭から 1/2・1/3・2/3 を絵にして、本文を続ける |',
    '',
    '置き方を書かなかったときは、横組みなら単独、縦組みなら起点側に回り込みます。',
    '`極小` `小` `中` `大` `単独` `回り込み` `別丁` `天` と日本語で書いても通ります。',
    '',
    '`plate` と `top` はページの割り付けなので、仕上げを「紙面に合わせる」にしたときと',
    '印刷のときに効きます。画面で続けて読むときは、大きな図として置かれます。',
    '別丁は版面いっぱいまでで、紙の縁までの塗り足しはできません。',
    '',
    '表紙と奥付に使う画像は `book.json` で指定します。どれも `images/` の中のファイル名です。',
    '',
    '| 項目 | 置かれる場所 |',
    '| --- | --- |',
    '| `coverImage` | 表紙、紋章の位置に置く図案 |',
    '| `coverBg` | 表紙の全面 |',
    '| `coloImage` | 奥付の図案（版元マークや近影） |',
    '| `coloBg` | 奥付の全面 |',
    '',
    '全面画像には文字を読ませるための幕がかかります。濃さは `coverVeil` / `coloVeil`',
    '（`light` `normal` `dark`）、寄せは `coverBgPos` / `coloBgPos`（`top` `center` `bottom`）で決めます。',
    '',
    '### 脚注',
    '',
    'その場に書く方法と、ラベルで参照する方法があります。',
    '',
    '```markdown',
    'この語には注を付ける^[短い注はこの書き方が早い]。',
    '',
    '長い注はラベルで参照する[^db]。',
    '',
    '[^db]: 定義はその章のどこに書いてもかまいません。',
    '```',
    '',
    '番号は章ごとに、本文に出てきた順で自動的に振られます。',
    '注そのものは各章の末尾にまとまります。',
    ''
  ].join('\n');
  return files;
}

/* --- ファイル群 → 本 --- */
function filesToBook(files, fallbackTitle){
  const dec = (v) => (typeof v === 'string') ? v : new TextDecoder().decode(v);
  let metaRaw = null;
  for(const k in files){ if(k === 'book.json' || k.endsWith('/book.json')) metaRaw = files[k]; }
  if(!metaRaw) throw new Error('book.json が見つかりません');
  const meta = JSON.parse(dec(metaRaw));

  const prefix = (() => {
    for(const k in files){ if(k.endsWith('book.json')) return k.slice(0, k.length - 'book.json'.length); }
    return '';
  })();

  const book = newBook(meta.title || fallbackTitle || '読み込んだ本');
  BOOK_META_KEYS.forEach(k => { if(meta[k] !== undefined) book[k] = meta[k]; });

  const order = Array.isArray(meta.chapters) ? meta.chapters
    : Object.keys(files).filter(k => /chapters\/.+\.md$/.test(k)).map(k => k.split('/').pop()).sort();

  book.images = {};
  const imgDir = prefix + 'images/';
  for(const k in files){
    if(k.indexOf(imgDir) !== 0) continue;
    const name = k.slice(imgDir.length);
    if(!name || name.slice(-1) === '/') continue;
    const raw = files[k];
    const bytes = (typeof raw === 'string') ? new TextEncoder().encode(raw) : raw;
    book.images[name] = { mime: imgMime(name), data: bytesToBase64(bytes), size: bytes.length, w: 0, h: 0 };
  }

  book.chapters = [];
  order.forEach(file => {
    const key = prefix + 'chapters/' + file;
    const raw = files[key] !== undefined ? files[key] : files['chapters/' + file];
    if(raw === undefined) return;
    const { meta: fm, body } = fmDecode(dec(raw));
    const ch = newChapter(fm.kind || 'body');
    ch.file = file;
    ch.title = fm.title || file.replace(/\.md$/, '');
    ch.eyebrow = fm.eyebrow || '';
    ch.status = fm.status || 'draft';
    ch.summary = fm.summary || '';
    ch.blocks = (ch.status === 'plan') ? [] : markdownToBlocks(body);
    book.chapters.push(ch);
  });
  return book;
}

/* ============ 書き出し ============ */
function download(name, content, type){
  const blob = new Blob([content], { type: type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function safeName(s){ return String(s).replace(/\n/g,'').replace(/[^\wぁ-んァ-ヶー一-龠]/g,'_').slice(0, 40) || 'book'; }
/* ============ プロジェクト（git で扱える形）の書き出し・読み込み ============ */
async function exportProject(){
  const book = getBook(); if(!book){ alert('本がありません。'); return; }
  try{
    const files = bookToFiles(book);
    // 生成したファイル名を控えておくと、次回も同じ名前で書き出せる（gitの差分が安定する）
    const order = JSON.parse(files['book.json']).chapters;
    book.chapters.forEach((ch, i) => { if(order[i]) ch.file = order[i]; });
    saveBook(book);
    const blob = await zipWrite(files);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = safeName(book.title) + '_project.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }catch(e){ alert('書き出しに失敗しました: ' + e.message); }
}

async function importProject(ev){
  const file = ev.target.files[0]; ev.target.value = '';
  if(!file) return;
  try{
    const files = await zipRead(await file.arrayBuffer());
    const book = filesToBook(files, file.name.replace(/\.zip$/i, ''));
    book.id = uid('book');
    books[book.id] = book; saveBook(book);
    currentBookId = book.id;
    currentChapterId = book.chapters.length ? book.chapters[0].id : null;
    sessionStorage.setItem('compositor_book', currentBookId);
    renderAll();
    backfillImageSizes(book);
    const nImg = Object.keys(book.images || {}).length;
    alert('「' + String(book.title).replace(/\n/g, ' ') + '」を読み込みました（' + book.chapters.length + '章'
      + (nImg ? '・画像' + nImg + '枚' : '') + '）。');
  }catch(e){ alert('読み込みに失敗しました: ' + e.message); }
}

function exportBookHtml(){
  const book = getBook(); if(!book){ alert('本がありません。'); return; }
  download(safeName(book.title) + '_' + (book.version || 'draft') + '.html', buildBookHtml(book), 'text/html;charset=utf-8');
}
function exportBackup(){
  download('compositor_backup_' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(books, null, 2), 'application/json');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      let n = 0;
      Object.values(data).forEach(b => {
        if(b && b.id && b.chapters){ if(!b.images) b.images = {}; books[b.id] = b; saveBook(b); backfillImageSizes(b); n++; }
      });
      alert(n + '冊を読み込みました。');
      currentBookId = currentBookId || Object.keys(books)[0]; renderAll();
    }catch(err){ alert('JSONの解析に失敗しました。'); }
  };
  r.readAsText(file); e.target.value = '';
}

/* ============ 起動 ============ */
function renderAll(){
  renderBookSelect(); renderChapterList(); renderChapterMeta(); renderBlocks(); renderPalette();
  renderPreview(); updateImageCount(); lucide.createIcons();
}
window.addEventListener('DOMContentLoaded', async () => {
  try{
    await initDB(); await loadAll();
    // 画像より前に作った本にも入れ物を用意する
    Object.values(books).forEach(b => { if(!b.images) b.images = {}; });
    attachAreaDrop();
    attachModalDrop();
    // 画面のどこに落としても、ブラウザが画像を開いてしまわないようにする
    ['dragover','drop'].forEach(t => window.addEventListener(t, e => { if(hasFiles(e)) e.preventDefault(); }));
    if(Object.keys(books).length === 0){
      const b = newBook('新しい本');
      b.chapters = [ Object.assign(newChapter('front'), { title:'はじめに' }), Object.assign(newChapter('body'), { title:'第一章' }) ];
      books[b.id] = b; saveBook(b);
    }
    const saved = sessionStorage.getItem('compositor_book');
    currentBookId = (saved && books[saved]) ? saved : Object.keys(books)[0];
    const bk = getBook(); if(bk && bk.chapters.length) currentChapterId = bk.chapters[0].id;
    setPreviewMode('chapter');
    renderAll();
  }catch(err){ alert('初期化に失敗しました: ' + err); }
});
