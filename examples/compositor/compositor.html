/* コメント記法 */
const LINE_COMMENT = {
  python:'#', ruby:'#', bash:'#', yaml:'#', hcl:'#', dockerfile:'#', r:'#', perl:'#', toml:'#', ini:'#',
  sql:'--', lua:'--', haskell:'--'
};
const HAS_BLOCK_COMMENT = new Set(['javascript','typescript','java','kotlin','go','rust','cpp','c','csharp','swift','scala','php','css','hcl']);

function canonLang(lang){
  const l = String(lang || '').trim().toLowerCase();
  return LANG_ALIAS[l] || l;
}

function tokenizeGeneric(src, lang){
  const kw = new Set((KW[lang] || '').split(/\s+/).filter(Boolean));
  const kwLower = new Set([...kw].map(s => s.toLowerCase()));
  const caseInsensitive = (lang === 'sql' || lang === 'dockerfile');
  const lineC = LINE_COMMENT[lang] || (HAS_BLOCK_COMMENT.has(lang) ? '//' : '#');
  const block = HAS_BLOCK_COMMENT.has(lang);

  let out = '', i = 0;
  const n = src.length;
  const isIdStart = c => /[A-Za-z_$@]/.test(c);
  const isId = c => /[A-Za-z0-9_$?!]/.test(c);

  while(i < n){
    const c = src[i];
    const rest = src.slice(i);

    // 行コメント
    if(rest.startsWith(lineC)){
      let j = src.indexOf('\n', i); if(j === -1) j = n;
      out += '<span class="c">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;
    }
    // ブロックコメント
    if(block && rest.startsWith('/*')){
      let j = src.indexOf('*/', i + 2); j = (j === -1) ? n : j + 2;
      out += '<span class="c">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;
    }
    // 三重引用符（Python）
    if((rest.startsWith('"""') || rest.startsWith("'''"))){
      const q = rest.slice(0,3);
      let j = src.indexOf(q, i + 3); j = (j === -1) ? n : j + 3;
      out += '<span class="s">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;
    }
    // 文字列
    if(c === '"' || c === "'" || c === '`'){
      let j = i + 1;
      while(j < n){
        if(src[j] === '\\'){ j += 2; continue; }
        if(src[j] === c){ j++; break; }
        if(src[j] === '\n' && c !== '`'){ break; }
        j++;
      }
      out += '<span class="s">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;
    }
    // 数値
    if(/[0-9]/.test(c) && !(i > 0 && isId(src[i-1]))){
      let j = i;
      while(j < n && /[0-9a-fA-FxXbBoO._]/.test(src[j])) j++;
      out += '<span class="n">' + esc(src.slice(i, j)) + '</span>'; i = j; continue;
    }
    // 識別子・キーワード
    if(isIdStart(c)){
      let j = i; while(j < n && isId(src[j])) j++;
      const word = src.slice(i, j);
      const match = caseInsensitive ? kwLower.has(word.toLowerCase()) : kw.has(word);
      if(match){
        out += '<span class="k">' + esc(word) + '</span>';
      } else {
        // 直後が ( なら関数名として扱う
        let k = j; while(k < n && src[k] === ' ') k++;
        out += (src[k] === '(') ? '<span class="f">' + esc(word) + '</span>' : esc(word);
      }
      i = j; continue;
    }
    // 記号
    if(/[{}\[\]().,;:=+\-*/%<>!&|^~?]/.test(c)){
      out += '<span class="p">' + esc(c) + '</span>'; i++; continue;
    }
    out += esc(c); i++;
  }
  return out;
}

function tokenize(code, lang){
  const l = canonLang(lang);
  if(l === 'json') return tokenizeJson(code);
  if(l === 'yaml') return tokenizeYaml(code);
  if(l === 'text' || l === '') return esc(code);
  return tokenizeGeneric(code, l);
}

/* ---- 全12種類の描画関数群 ---- */

// 1. 相関図 (graph)
function renderGraphDiagram(data) {
  const nodes = data.nodes || [], edges = data.edges || [], W = 620, pos = {};
  const parents = nodes.filter(n => n.role === 'parent'), children = nodes.filter(n => n.role !== 'parent');
  parents.forEach((n, i) => pos[n.id] = { x: parents.length === 1 ? W/2 : 120 + i*(W-240)/(parents.length-1||1), y: 50, n });
  children.forEach((n, i) => pos[n.id] = { x: children.length === 1 ? W/2 : 100 + i*(W-200)/(children.length-1||1), y: 160, n });
  const H = children.length ? 210 : 110;

  const edgeSvg = edges.map(e => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return '';
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return `<line x1="${a.x}" y1="${a.y + 20}" x2="${b.x}" y2="${b.y - 20}" stroke="var(--badge-color)" stroke-width="1.5" marker-end="url(#kp-arrow)"/>
      ${e.label ? `<rect x="${mx-24}" y="${my-9}" width="48" height="18" rx="4" fill="var(--bg-main)" stroke="var(--card-border)" stroke-width="0.8"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-family="var(--mono)" font-size="9" font-weight="700" fill="var(--label-ink)">${esc(e.label)}</text>` : ''}`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    const p = pos[n.id]; if (!p) return '';
    return `<g><rect x="${p.x - 70}" y="${p.y - 20}" width="140" height="40" rx="7" fill="var(--node-bg)" stroke="var(--node-border)" stroke-width="1.4"/>
      <text x="${p.x}" y="${p.y - 1}" text-anchor="middle" font-family="var(--sans)" font-size="11.5" font-weight="600" fill="var(--text-heading)">${esc(n.title)}</text>
      ${n.sub ? `<text x="${p.x}" y="${p.y + 11}" text-anchor="middle" font-family="var(--mono)" font-size="8.5" fill="var(--badge-color)">${esc(n.sub)}</text>` : ''}</g>`;
  }).join('');

  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🔗 ${esc(data.kicker || 'RELATIONSHIP')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="c-canvas"><svg viewBox="0 0 ${W} ${H}">
      <defs><marker id="kp-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--badge-color)"/></marker></defs>
      ${edgeSvg}${nodeSvg}
    </svg></div></figure>`;
}

// 2. シーケンス図 (sequence) — 矢印反転バグ 完全撲滅版
function renderSequenceDiagram(data) {
  const actors = data.actors || [], messages = data.messages || []; if (!actors.length) return '';
  const W = 620, posX = {}; actors.forEach((a, i) => posX[a.id] = 80 + i * (W - 160) / (actors.length - 1 || 1));
  const startY = 60, stepH = 38, endY = startY + (messages.length + 1) * stepH, H = endY + 30;

  const lifelines = actors.map(a => {
    const x = posX[a.id];
    return `<line x1="${x}" y1="${startY}" x2="${x}" y2="${endY}" stroke="var(--card-border)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <rect x="${x - 50}" y="${startY - 28}" width="100" height="28" rx="6" fill="var(--node-bg)" stroke="var(--node-border)" stroke-width="1.2"/>
      <text x="${x}" y="${startY - 10}" text-anchor="middle" font-family="var(--mono)" font-size="10.5" font-weight="600" fill="var(--text-heading)">${esc(a.title)}</text>
      <rect x="${x - 50}" y="${endY - 2}" width="100" height="28" rx="6" fill="var(--node-bg)" stroke="var(--node-border)" stroke-width="1.2"/>
      <text x="${x}" y="${endY + 16}" text-anchor="middle" font-family="var(--mono)" font-size="10.5" font-weight="600" fill="var(--text-heading)">${esc(a.title)}</text>`;
  }).join('');

  const msgSvg = messages.map((m, i) => {
    const x1 = posX[m.from], x2 = posX[m.to]; if (!x1 || !x2) return '';
    const y = startY + (i + 1) * stepH, isAsync = m.type === 'async', mx = (x1 + x2) / 2;

    return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="var(--badge-color)" stroke-width="1.5" ${isAsync ? 'stroke-dasharray="4 4"' : ''} marker-end="url(#seq-arrow)"/>
      <rect x="${mx - 55}" y="${y - 14}" width="110" height="15" rx="3" fill="var(--bg-main)" opacity="0.9"/>
      <text x="${mx}" y="${y - 3}" text-anchor="middle" font-family="var(--sans)" font-size="10" fill="var(--text-heading)">${esc(m.label)}</text>`;
  }).join('');

  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🔄 ${esc(data.kicker || 'SEQUENCE FLOW')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="c-canvas"><svg viewBox="0 0 ${W} ${H}">
      <defs>
        <!-- 標準の右向き矢印マーカー（orient="auto" により描画線の進行方向へ自動回転） -->
        <marker id="seq-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="var(--badge-color)"/>
        </marker>
      </defs>
      ${lifelines}${msgSvg}
    </svg></div></figure>`;
}

// 3. フロー/決定木 (flow)
function renderFlowDiagram(data) {
  const nodes = data.nodes || [], edges = data.edges || [], W = 620, H = 180, pos = {};
  nodes.forEach((n, i) => pos[n.id] = { x: 80 + i * (W - 160) / (nodes.length - 1 || 1), y: 90, n });

  const edgeSvg = edges.map(e => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return '';
    return `<line x1="${a.x + 45}" y1="${a.y}" x2="${b.x - 45}" y2="${b.y}" stroke="var(--badge-color)" stroke-width="1.5" marker-end="url(#kp-arrow)"/>
      ${e.label ? `<text x="${(a.x+b.x)/2}" y="${a.y - 8}" text-anchor="middle" font-family="var(--mono)" font-size="9.5" font-weight="600" fill="var(--label-ink)">${esc(e.label)}</text>` : ''}`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    const p = pos[n.id]; if (!p) return '';
    const isDec = n.type === 'decision';
    return `<g><rect x="${p.x - 45}" y="${p.y - 18}" width="90" height="36" rx="${isDec ? '18' : '6'}" fill="var(--node-bg)" stroke="var(--node-border)" stroke-width="1.4"/>
      <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-family="var(--sans)" font-size="10.5" font-weight="500" fill="var(--text-heading)">${esc(n.title)}</text></g>`;
  }).join('');

  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🔀 ${esc(data.kicker || 'FLOWCHART')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="c-canvas"><svg viewBox="0 0 ${W} ${H}">
      <defs><marker id="kp-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="var(--badge-color)"/></marker></defs>
      ${edgeSvg}${nodeSvg}
    </svg></div></figure>`;
}

// 4. レイヤー構造 (layer)
function renderLayerDiagram(data) {
  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🏛️ ${esc(data.kicker||'ARCHITECTURE')}</span><h4 class="c-fig-title">${esc(data.title||'')}</h4></div>
    <div class="c-layer-stack">${(data.layers||[]).map(l => `<div class="c-layer-item"><span class="c-layer-title">${esc(l.title)}</span><span class="c-layer-desc">${esc(l.desc||'')}</span></div>`).join('')}</div></figure>`;
}

// 5. ネットワーク構成図 (network) — ノード間接続ライン対応版
function renderNetworkDiagram(data) {
  const subnets = data.subnets || [], links = data.links || [];
  const W = 620;
  
  // 各ノードの座標を自動計算して保存するオブジェクト
  const nodePos = {};
  
  // サブネットとノードの高さ・配置計算
  let currentY = 50;
  const subnetBoxes = subnets.map((s, sI) => {
    const nodes = s.nodes || [];
    const boxY = currentY;
    const boxH = 75;
    
    const nodeSvg = nodes.map((n, nI) => {
      // 横方向に均等配置
      const x = 80 + nI * (W - 160) / (nodes.length || 1) + (nodes.length === 1 ? (W - 160)/2 : 0);
      const y = boxY + 42;
      
      // ID または title で座標を登録
      const nodeId = n.id || n.title;
      nodePos[nodeId] = { x, y };

      return `<g id="node-${esc(nodeId)}">
        <rect x="${x - 55}" y="${y - 16}" width="110" height="32" rx="6" fill="var(--node-bg)" stroke="var(--node-border)" stroke-width="1.2"/>
        <text x="${x}" y="${y + 4}" text-anchor="middle" font-family="var(--sans)" font-size="10.5" font-weight="600" fill="var(--text-heading)">📦 ${esc(n.title)}</text>
      </g>`;
    }).join('');

    const res = `<g>
      <!-- サブネット外枠（点線） -->
      <rect x="30" y="${boxY}" width="${W - 60}" height="${boxH}" rx="8" fill="rgba(0,0,0,0.01)" stroke="var(--card-border)" stroke-width="1.2" stroke-dasharray="4 4"/>
      <text x="42" y="${boxY + 18}" font-family="var(--mono)" font-size="9.5" font-weight="600" fill="var(--badge-color)">🔒 ${esc(s.name)}</text>
      ${nodeSvg}
    </g>`;

    currentY += boxH + 35; // 次のサブネットへのマージン
    return res;
  }).join('');

  const H = currentY + 10;

  // ノード間をつなぐ「接続線（矢印＋ラベル）」の描画
  const linkSvg = links.map(l => {
    const a = nodePos[l.from], b = nodePos[l.to];
    if (!a || !b) return '';
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;

    return `<g>
      <!-- 接続線 -->
      <line x1="${a.x}" y1="${a.y + 16}" x2="${b.x}" y2="${b.y - 16}" stroke="var(--badge-color)" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#net-arrow)"/>
      ${l.label ? `
        <rect x="${mx - 25}" y="${my - 8}" width="50" height="16" rx="3" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="0.8"/>
        <text x="${mx}" y="${my + 3}" text-anchor="middle" font-family="var(--mono)" font-size="8.5" font-weight="700" fill="var(--label-ink)">${esc(l.label)}</text>
      ` : ''}
    </g>`;
  }).join('');

  return `<figure class="c-figure-card">
    <div class="mb-2"><span class="c-fig-badge">🌐 ${esc(data.kicker || 'NETWORK ARCHITECTURE')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="c-canvas">
      <svg viewBox="0 0 ${W} ${H}">
        <defs>
          <marker id="net-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="var(--badge-color)"/>
          </marker>
        </defs>
        ${subnetBoxes}
        ${linkSvg}
      </svg>
    </div>
  </figure>`;
}

// 6. 折れ線グラフ (line)
function renderLineChart(data) {
  const labels = data.labels || [], vals = data.values || []; if (!vals.length) return '';
  const W = 600, H = 180, maxV = Math.max(...vals, 1);
  const pts = vals.map((v, i) => ({ x: 50 + i * (W - 100) / (vals.length - 1 || 1), y: H - 30 - (v / maxV) * (H - 60), v }));
  const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">📈 ${esc(data.kicker || 'LINE CHART')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="c-canvas"><svg viewBox="0 0 ${W} ${H}">
      <path d="${pathD}" fill="none" stroke="var(--badge-color)" stroke-width="2"/>
      ${pts.map((p, i) => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--bg-main)" stroke="var(--badge-color)" stroke-width="2"/>
        <text x="${p.x}" y="${H - 8}" text-anchor="middle" font-family="var(--mono)" font-size="9.5" fill="var(--text-sub)">${esc(labels[i]||'')}</text>
        <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" font-family="var(--mono)" font-size="9.5" font-weight="600" fill="var(--text-heading)">${p.v}</text>`).join('')}
    </svg></div></figure>`;
}

// 7. 棒グラフ (bar)
function renderBarChart(data) {
  const labels = data.labels || [], vals = data.values || []; if (!vals.length) return '';
  const W = 600, H = 180, maxV = Math.max(...vals, 1), barW = Math.min(44, (W - 100) / vals.length - 12);

  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">📊 ${esc(data.kicker || 'BAR CHART')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="c-canvas"><svg viewBox="0 0 ${W} ${H}">
      ${vals.map((v, i) => {
        const x = 60 + i * (W - 120) / (vals.length || 1), h = (v / maxV) * (H - 60), y = H - 30 - h;
        return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="var(--node-bg)" stroke="var(--badge-color)" stroke-width="1.2"/>
          <text x="${x + barW/2}" y="${y - 6}" text-anchor="middle" font-family="var(--mono)" font-size="9.5" font-weight="600" fill="var(--text-heading)">${v}</text>
          <text x="${x + barW/2}" y="${H - 8}" text-anchor="middle" font-family="var(--sans)" font-size="9.5" fill="var(--text-sub)">${esc(labels[i]||'')}</text>`;
      }).join('')}
    </svg></div></figure>`;
}

// 8. 円グラフ (pie) — カラーシェード & 凡例連動 修正版
function renderPieChart(data) {
  const items = data.items || []; if (!items.length) return '';
  const total = items.reduce((sum, it) => sum + Number(it.value || 0), 0) || 1;
  let cumPercent = 0;

  // テーマに応じたカラーパレット（墨インク系・朱赤アクセント / ゴールド系）
  const colors = [
    'var(--badge-color)',              // 朱赤 / ゴールドハイライト
    'rgba(168, 56, 42, 0.65)',        // 朱赤 (中)
    'rgba(168, 56, 42, 0.40)',        // 朱赤 (薄)
    'rgba(26, 26, 30, 0.15)'           // 墨色 (極薄)
  ];

  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🍕 ${esc(data.kicker || 'PIE CHART')}</span><h4 class="c-fig-title">${esc(data.title || '')}</h4></div>
    <div class="flex items-center justify-around mt-4">
      <svg width="150" height="150" viewBox="-1.1 -1.1 2.2 2.2" style="transform: rotate(-90deg)">
        ${items.map((it, i) => {
          const startX = Math.cos(2 * Math.PI * cumPercent), startY = Math.sin(2 * Math.PI * cumPercent);
          cumPercent += Number(it.value) / total;
          const endX = Math.cos(2 * Math.PI * cumPercent), endY = Math.sin(2 * Math.PI * cumPercent);
          const largeArc = (it.value / total) > 0.5 ? 1 : 0;
          const color = colors[i % colors.length];
          return `<path d="M 0 0 L ${startX} ${startY} A 1 1 0 ${largeArc} 1 ${endX} ${endY} Z" fill="${color}" stroke="var(--card-bg)" stroke-width="0.03"/>`;
        }).join('')}
      </svg>
      <div class="flex flex-col gap-2.5">
        ${items.map((it, i) => {
          const color = colors[i % colors.length];
          return `<div class="flex items-center gap-2.5 text-xs">
            <span class="w-3 h-3 rounded-full shrink-0" style="background: ${color}; border: 1px solid var(--card-border);"></span>
            <span class="text-[color:var(--text-heading)] font-medium min-w-[100px]">${esc(it.label)}</span>
            <span class="font-mono text-[color:var(--badge-color)] font-bold">${Math.round(it.value/total*100)}%</span>
          </div>`;
        }).join('')}
      </div>
    </div></figure>`;
}

// 9. リスクマトリクス (matrix)
function renderMatrixDiagram(data) {
  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🎯 ${esc(data.kicker||'MATRIX')}</span><h4 class="c-fig-title">${esc(data.title||'')}</h4></div>
    <div class="c-matrix-grid" style="grid-template-columns: 60px repeat(${(data.cols||[]).length}, minmax(0, 1fr));">
      <div></div>${(data.cols||[]).map(c => `<div class="c-matrix-col-head">${esc(c)}</div>`).join('')}
      ${(data.rows||[]).map((r, rI) => `<div class="c-matrix-row-head">${esc(r)}</div>` + (data.cols||[]).map((_, cI) => `<div class="c-matrix-cell"><span class="text-xs font-medium text-[color:var(--text-heading)]">${esc(((data.cells||[])[rI]&&data.cells[rI][cI])?data.cells[rI][cI].val:'-')}</span></div>`).join('')).join('')}
    </div></figure>`;
}

// 10. 4象限マップ (quad)
function renderQuadDiagram(data) {
  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">🧭 ${esc(data.kicker||'POSITIONING')}</span><h4 class="c-fig-title">${esc(data.title||'')}</h4></div>
    <div class="c-quad-canvas"><div class="c-quad-axis-v"></div><div class="c-quad-axis-h"></div>
      <span class="c-quad-label top">${esc(data.yAxis?.top||'')}</span><span class="c-quad-label bottom">${esc(data.yAxis?.bottom||'')}</span>
      <span class="c-quad-label left">${esc(data.xAxis?.left||'')}</span><span class="c-quad-label right">${esc(data.xAxis?.right||'')}</span>
      ${(data.nodes||[]).map(n => `<div class="c-quad-node" style="left:${n.x}%; top:${100-n.y}%;"><span class="c-quad-dot"></span><span class="c-quad-node-title">${esc(n.label)}</span></div>`).join('')}
    </div></figure>`;
}

// 11. ガントチャート (gantt)
function renderGanttDiagram(data) {
  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">📅 ${esc(data.kicker||'GANTT')}</span><h4 class="c-fig-title">${esc(data.title||'')}</h4></div>
    <div class="c-gantt-wrap">
      <div class="c-gantt-head" style="grid-template-columns: 140px repeat(${(data.months||[]).length}, minmax(0,1fr));"><div class="c-gantt-th">Task</div>${(data.months||[]).map(m => `<div class="c-gantt-th tc">${esc(m)}</div>`).join('')}</div>
      ${(data.items||[]).map(r => `<div class="c-gantt-row" style="grid-template-columns: 140px 1fr;"><div class="c-gantt-label">${esc(r.title)}</div><div class="c-gantt-track"><div class="c-gantt-bar" style="left:10%; width:60%;"><span>${esc(r.tag||'')}</span></div></div></div>`).join('')}
    </div></figure>`;
}

// 12. 年表・タイムライン (timeline)
function renderTimelineDiagram(data) {
  return `<figure class="c-figure-card"><div class="mb-2"><span class="c-fig-badge">⏱️ ${esc(data.kicker||'TIMELINE')}</span><h4 class="c-fig-title">${esc(data.title||'')}</h4></div>
    <div class="c-vtimeline"><div class="c-vtl-line"></div>
      ${(data.events||[]).map(e => `<div class="c-vtl-item"><div class="c-vtl-node"></div><div class="c-vtl-time">${esc(e.time||'')}</div><div class="c-vtl-title">${esc(e.title||'')}</div><div class="c-vtl-desc">${esc(e.desc||'')}</div></div>`).join('')}
    </div></figure>`;
}

/* ---- 総合ディスパッチャー（全12種類を完全分岐） ---- */
function renderDiagram(data) {
  const k = (data.kind || '').toLowerCase();
  
  if (k === 'graph' || k === 'capital' || k === 'relationship') return renderGraphDiagram(data);
  if (k === 'sequence' || k === 'seq') return renderSequenceDiagram(data);
  if (k === 'flow' || k === 'decision' || k === 'tree') return renderFlowDiagram(data);
  if (k === 'layer' || k === 'architecture') return renderLayerDiagram(data);
  if (k === 'network' || k === 'vpc') return renderNetworkDiagram(data);
  if (k === 'line') return renderLineChart(data);
  if (k === 'bar') return renderBarChart(data);
  if (k === 'pie' || k === 'donut') return renderPieChart(data);
  if (k === 'matrix') return renderMatrixDiagram(data);
  if (k === 'quad') return renderQuadDiagram(data);
  if (k === 'gantt') return renderGanttDiagram(data);
  if (k === 'timeline') return renderTimelineDiagram(data);

  return renderGraphDiagram(data);
}

/* ============ ブロック → HTML ============ */
function blockHtml(b, ctx){
  // 脚注の定義行は prepareChapter で抜いてあるので、そちらの本文を使う
  if(b.type === 'prose') return renderProse((ctx && ctx.bodies[b.id] !== undefined) ? ctx.bodies[b.id] : b.text, ctx);
  if(b.type === 'lead') return b.text && b.text.trim() ? '<p class="lead-in">' + esc(b.text.trim()) + '</p>' : '';
  if(b.type === 'code'){
    if(!b.code || !b.code.trim()) return '';
    return '<div class="code">\n<div class="bar"><span class="dot"></span>' + esc(b.label || '') + '</div>\n<pre>' + tokenize(b.code, b.lang) + '</pre>\n</div>';
  }
  if(b.type === 'figure'){
    if(!b.svg || !b.svg.trim()) return '';
    const cap = b.caption && b.caption.trim() ? '<figcaption>' + esc(b.caption.trim()) + '</figcaption>' : '';
    return '<figure>\n<div class="fig-card">' + b.svg + '</div>\n' + cap + '\n</figure>';
  }
  if(b.type === 'diagram'){
    if(!b.json || !b.json.trim()) return '';
    let data;
    try{ data = JSON.parse(b.json); }
    catch(err){ return '<div class="code"><div class="bar"><span class="dot"></span>diagram · JSON エラー</div><pre>' + esc(String(err.message)) + '</pre></div>'; }
    const cap = b.caption && b.caption.trim() ? '<figcaption>' + esc(b.caption.trim()) + '</figcaption>' : '';
    return '<figure class="diagram-figure">\n' + renderDiagram(data) + '\n' + cap + '\n</figure>';
  }
  return '';
}

function chapterHtml(book, ch){
  const id = sectionId(book, ch);
  const front = ch.kind === 'front' ? ' frontmatter' : '';
  let inner;
  if(ch.status === 'plan'){
    inner = '<div class="reading">\n<div class="outline">\n<div class="card">\n<div class="ch">' + esc(autoEyebrow(book, ch)) +
      '</div>\n<h4>' + esc(ch.title) + '</h4>\n<p>' + esc(ch.summary || '') + '</p>\n</div>\n</div>\n</div>';
  } else {
    const ctx = prepareChapter(book, ch);
    const body = ch.blocks.map(b => blockHtml(b, ctx)).filter(Boolean).join('\n');
    const notes = footnotesHtml(ctx);
    inner = '<div class="prose reading">\n' + body + '\n</div>' + (notes ? '\n' + notes : '');
  }
  return '<section class="movement' + front + '" id="' + id + '">\n' +
    '<div class="divider">\n<span class="node" aria-hidden="true"></span>\n<span class="eyebrow">' + esc(autoEyebrow(book, ch)) +
    '</span>\n<h2>' + esc(ch.title) + '</h2>\n<div class="rule"></div>\n</div>\n' + inner + '\n</section>';
}

function tocHtml(book){
  const items = book.chapters.map(ch => {
    const badge = ch.status === 'plan' ? '<span class="st plan">章立て</span>'
                : ch.status === 'draft' ? '<span class="st draft">草稿</span>' : '';
    return '<li><a href="#' + sectionId(book, ch) + '"><span class="n">' + tocLabel(book, ch) +
      '</span><span class="t">' + esc(ch.title) + '</span>' + badge + '</a></li>';
  }).join('\n');
  return '<nav class="toc" aria-label="目次">\n<div class="lead">目次</div>\n<ol>\n' + items + '\n</ol>\n</nav>';
}

function progressText(book){
  const total = book.chapters.length;
  const done = book.chapters.filter(c => c.status !== 'plan').length;
  if(total === 0) return '構想中';
  if(done === 0) return '章立て';
  if(done === total) return '全編（' + total + '章）';
  return '第1〜' + done + '章を執筆済み（全' + total + '章）';
}

/* 判型ごとの用紙と本文領域（mm）。印刷余白と画面の紙面モードで共用する */
const PAGE_BOX = {
  /* 天は地よりやや狭く、小口はゆったり。和文書籍の一般的な取り方に合わせる。
     chars は縦組み、charsH は横組みの目標字詰め。
     ここから本文の文字サイズを逆算する（版面設計）。 */
  A5: { pw:'148mm', ph:'210mm', mt:'18mm', mb:'22mm', mh:'16mm', w:'116mm', h:'170mm', chars:44, charsH:32 },
  B5: { pw:'176mm', ph:'250mm', mt:'20mm', mb:'25mm', mh:'18mm', w:'140mm', h:'205mm', chars:48, charsH:38 },
  A4: { pw:'210mm', ph:'297mm', mt:'25mm', mb:'30mm', mh:'22mm', w:'166mm', h:'242mm', chars:52, charsH:42 },
  A6: { pw:'105mm', ph:'148mm', mt:'13mm', mb:'16mm', mh:'12mm', w:'81mm',  h:'119mm', chars:41, charsH:26 }
};

const markFigure = (name) => '<div class="mark-figure"><img src="images/' + esc(name) + '" alt=""></div>';

/* 表紙の図案。独自SVG > 画像 > 組み込みの紋章、の順に優先する。 */
function coverArtHtml(book){
  const custom = (book.coverArt || '').trim();
  if(custom) return '<div class="emblem">' + custom + '</div>';
  const img = (book.coverImage || '').trim();
  if(img) return markFigure(img);
  const key = book.coverEmblem || '';
  if(key === 'none' || !EMBLEMS[key]) return '';
  return '<div class="emblem">' + EMBLEMS[key].svg + '</div>';
}

/* 奥付の図案。版元マークや近影を置く場所で、紋章の既定はない。 */
function coloArtHtml(book){
  const img = (book.coloImage || '').trim();
  return img ? markFigure(img) : '';
}

/* 図案の大きさ。倍率をクラスで渡し、CSS 側で基準の幅に掛ける。 */
const markClass = (v) => (v && v !== 'm') ? (' mk-' + v) : '';

/* 全面画像の印。表紙と奥付で同じ形にする。 */
function bleedParts(name, veil, pos){
  const src = String(name || '').trim();
  if(!src) return { mods: '', html: '' };
  return {
    mods: ' has-bg veil-' + (veil || 'normal') + ' pos-' + (pos || 'center'),
    html: '<img class="bleed-img" src="images/' + esc(src) + '" alt="">\n<div class="bleed-veil"></div>\n'
  };
}

function buildBookHtml(book, chapterOnly){
  const vertical = book.direction === 'vertical';
  const paperMode = book.viewMode === 'paper';
  const coverTitle = esc(book.title).replace(/\n/g, '<br>');
  let parts = [];
  const htmlCls = [vertical ? 'vertical' : '', paperMode ? 'paper-mode' : ''].filter(Boolean).join(' ');
  parts.push('<!DOCTYPE html>\n<html lang="ja"' + (htmlCls ? ' class="' + htmlCls + '"' : '') + '>\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">');
  parts.push('<title>' + esc(book.title.replace(/\n/g,'')) + (book.version ? ' — 草稿' : '') + '</title>');
  parts.push('<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
  parts.push('<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">');
  const paper = book.paperSize || 'A5';
  const box = PAGE_BOX[paper] || PAGE_BOX.A5;
  // 版面設計：すべて書き出し時に確定計算する。
  // 実行時に測って調整すると、環境によって値が揺れて行が切れるため。
  const MM = 96 / 25.4;
  const runMm   = parseFloat(vertical ? box.h : box.w);   // 字が並ぶ方向
  const crossMm = parseFloat(vertical ? box.w : box.h);   // 行が積まれる方向
  const runChars = vertical ? (box.chars || 44) : (box.charsH || 32);
  const bodyPx = (runMm / runChars) * MM;                 // 本文の文字サイズ
  const crossPx = crossMm * MM;
  const lines = Math.max(1, Math.round(crossPx / (bodyPx * 1.75)));
  const advPx = Math.max(6, Math.floor(crossPx / lines)); // 行送りは整数pxに固定
  const runPx = lines * advPx;                            // ちょうど lines 行ぶん
  const pageCss = '@page{size:' + paper + ' portrait;margin:' + (box.mt + ' ' + box.mh + ' ' + box.mb) + '}\n' +
                  ':root{--page-w:' + box.w + ';--page-h:' + box.h +
                  ';--paper-w:' + box.pw + ';--paper-h:' + box.ph +
                  ';--mg-t:' + box.mt + ';--mg-b:' + box.mb + ';--mg-h:' + box.mh +
                  ';--body-size:' + bodyPx.toFixed(2) + 'px' +
                  ';--line-adv:' + advPx + 'px' +
                  ';--page-run:' + runPx + 'px' +
                  ';--lines:' + lines + '}';
  parts.push('<style>\n' + BOOK_CSS + '\n' + ADDON_CSS + '\n' + pageCss + '\n</style>\n</head>\n<body' + (vertical ? ' class="vertical"' : '') + '>');
  const bodyIdx = parts.length - 1;

  // cover
  const coverBleed = bleedParts(book.coverBg, book.coverVeil, book.coverBgPos);
  // クラス名は後で紙面用に足すので、いったん印を置いてから差し替える
  let cover = '<header class="@@COVERCLASS@@">\n' + coverBleed.html + '<div class="inner">\n';
  const art = coverArtHtml(book);
  if(art) cover += art + '\n';
  if(book.kicker) cover += '<div class="kicker">' + esc(book.kicker) + '</div>\n';
  cover += '<h1>' + coverTitle + '</h1>\n';
  if(book.provisional) cover += '<div class="provisional">' + esc(book.provisional) + '</div>\n';
  if(book.subtitle) cover += '<p class="sub">' + esc(book.subtitle) + '</p>\n';
  if(book.thesisA || book.thesisB || book.thesisDerive){
    cover += '<div class="thesis-strip">\n';
    if(book.thesisA) cover += '<span>' + esc(book.thesisA) + '</span>';
    if(book.thesisA && book.thesisB) cover += '<span class="arrow">→</span>';
    if(book.thesisB) cover += '<b>' + esc(book.thesisB) + '</b>';
    if(book.thesisDerive) cover += '\n<span class="derive">' + esc(book.thesisDerive) + '</span>';
    cover += '\n</div>\n';
  }
  cover += '</div>\n</header>';
  const yoko = book.coverDirection === 'horizontal' ? ' plate-yoko' : '';
  const coverBase = 'cover' + coverBleed.mods + markClass(book.coverMarkSize);
  const coverScreen = cover.replace('@@COVERCLASS@@', coverBase);
  const coverHtml = cover.replace('@@COVERCLASS@@', coverBase + ' plate cover-plate' + yoko);
  if(!paperMode && !chapterOnly) parts.push(coverScreen);

  if(book.draftnote && !chapterOnly){
    parts.push('<div class="draftnote">\n<div class="box">\n<p class="h">' + esc(book.draftnoteTitle || 'この草稿について') +
      '</p>\n<p>' + esc(book.draftnote) + '</p>\n</div>\n</div>');
  }
  if(!chapterOnly) parts.push(tocHtml(book));
  parts.push('<div class="book">');
  book.chapters.forEach(ch => parts.push(chapterHtml(book, ch)));
  parts.push('</div>');

  // colophon
  const line = [book.series, book.volume].filter(Boolean).join(' ');
  let meta = esc(book.title.replace(/\n/g,'')) + (book.provisional ? '（仮題）' : '') + '<br>\n';
  if(book.subtitle) meta += esc(book.subtitle) + '<br>\n';
  meta += [line, book.version ? '<b>草稿 ' + esc(book.version) + '</b>' : '', esc(book.year), progressText(book)]
            .filter(Boolean).join(' &nbsp;·&nbsp; ');
  const coloBleed = bleedParts(book.coloBg, book.coloVeil, book.coloBgPos);
  let colo = '<footer class="@@COLOCLASS@@">\n' + coloBleed.html + '<div class="inner">\n';
  const coloArt = coloArtHtml(book);
  if(coloArt) colo += coloArt + '\n';
  if(book.closingMark) colo += '<p class="mark">' + esc(book.closingMark) + '</p>\n';
  colo += '<div class="meta">\n' + meta + '\n';
  if(book.credit) colo += '<div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(194,167,107,.22);line-height:2;">' + esc(book.credit) + '</div>\n';
  colo += '</div>\n</div>\n</footer>';
  const coloBase = 'colophon' + coloBleed.mods + markClass(book.coloMarkSize);
  const coloScreen = colo.replace('@@COLOCLASS@@', coloBase);
  const coloHtml = colo.replace('@@COLOCLASS@@', coloBase + ' plate colophon-plate' + yoko);
  if(!paperMode && !chapterOnly) parts.push(coloScreen);

  if(paperMode){
    // 紙（stage）の中に、本文が流れる窓（flow）を置く。
    // 窓は左右の余白ぶん内側にあるので、どのページにも小口の余白が残る。
    // 表紙と奥付は紙いっぱいに広げたいので、窓の外に別丁として置く。
    const head = parts.slice(0, bodyIdx + 1);
    const body = parts.slice(bodyIdx + 1);
    parts = head
      .concat(['<div class="stage">'])
      .concat(chapterOnly ? [] : [coverHtml])
      .concat(['<div class="flow"><div class="reel">'])
      .concat(body)
      .concat(['</div></div>'])
      .concat(chapterOnly ? [] : [coloHtml])
      .concat(['</div>']);
  }
  if(vertical || paperMode) parts.push(PAGER_HTML);
  parts.push('</body>\n</html>');
  return resolveImages(parts.join('\n'), book);
}

const PAGER_HTML = [
'<nav class="pager" aria-label="ページ送り">',
'  <button type="button" data-dir="-1" aria-label="前のページへ">\u25b7</button>',
'  <span class="folio" aria-live="polite"></span>',
'  <button type="button" data-dir="1" aria-label="次のページへ">\u25c1</button>',
'</nav>',
'<script>',
'(function(){',
'  var stage = document.querySelector(".stage");',
'  var flow  = document.querySelector(".flow");',
'  var reel  = document.querySelector(".reel");',
'  if(!stage || !flow || !reel) return;',
'  var vert  = document.documentElement.classList.contains("vertical");',
'  var folio = document.querySelector(".folio");',
'  var cover = stage.querySelector(".cover-plate");',
'  var colo  = stage.querySelector(".colophon-plate");',
'  var lead  = cover ? 1 : 0;',
'  var tail  = colo ? 1 : 0;',
'  var idx = 0;',
'',
'  function zoom(){',
'    var m = (stage.style.transform || "").match(/scale\\(([\\d.]+)\\)/);',
'    return m ? (parseFloat(m[1]) || 1) : 1;',
'  }',
'  /* ページの送り幅。clientWidth は整数に丸まるので、窓の実寸と段の幅が',
'     わずかにずれ、隣のページの端が覗いてしまう。実寸で揃える。',
'     ほぼ整数のときは整数に寄せる（縦組みは行の格子が整数のため）。 */',
'  function pw(){',
'    var x = flow.getBoundingClientRect().width / zoom();',
'    var r = Math.round(x);',
'    return Math.abs(x - r) < 0.02 ? r : x;',
'  }',
'  /* 本文の総幅。縦組みは reel の幅がそのまま巻物の長さになる。',
'     横組みは段からあふれた列が箱の外へ出るので、実寸を見ないと数え落とす。 */',
'  function reelLen(){',
'    var box = reel.getBoundingClientRect().width / zoom();',
'    return Math.round(vert ? box : Math.max(box, reel.scrollWidth));',
'  }',
'  function inner(){ return Math.max(1, Math.ceil((reelLen() - 1) / pw())); }',
'  function pages(){ return lead + inner() + tail; }',
'',
'  /* スクロールではなく平行移動で見せる。縦組みのスクロールは',
'     描画が乱れることがあり、位置も小数になりやすいため。 */',
'  /* 位置そのものを動かす。transform だと独立した描画層になり、',
'     親の切り取りをすり抜けて余白に文字が出る環境があるため。 */',
'  function place(i, animate){',
'    var f = Math.max(0, Math.min(i - lead, inner() - 1));',
'    var shift = f * pw();',
'    reel.style.transition = animate ? "" : "none";',
'    if(vert) reel.style.right = (-shift) + "px";',
'    else     reel.style.left  = (-shift) + "px";',
'    if(!animate) { void reel.offsetWidth; reel.style.transition = ""; }',
'  }',
'  function setFolio(){ if(folio) folio.textContent = (idx + 1) + " / " + pages(); }',
'  function goTo(i, animate){',
'    idx = Math.max(0, Math.min(i, pages() - 1));',
'    if(cover) cover.classList.toggle("on", idx === 0);',
'    if(colo)  colo.classList.toggle("on", idx === pages() - 1);',
'    place(idx, animate !== false);',
'    setFolio();',
'  }',
'  function turn(d){ goTo(idx + d, true); }',
'',
'  /* 矢印の向きは読む向きに合わせる。縦組みは右から左へ読むので「次へ」が左向き、',
'     横組みは左から右へ読むので「次へ」が右向きになる。 */',
'  Array.prototype.forEach.call(document.querySelectorAll(".pager button"), function(b){',
'    var d = parseInt(b.getAttribute("data-dir"), 10);',
'    b.textContent = ((d > 0) === vert) ? "\\u25c1" : "\\u25b7";',
'    b.addEventListener("click", function(){ turn(d); });',
'  });',
'  window.addEventListener("keydown", function(e){',
'    /* 矢印キーも読む向きに合わせる。縦組みは左が次、横組みは右が次。 */',
'    var fwd  = vert ? "ArrowLeft"  : "ArrowRight";',
'    var back = vert ? "ArrowRight" : "ArrowLeft";',
'    if(e.key === fwd || e.key === "PageDown" || e.key === " "){ e.preventDefault(); turn(1); }',
'    else if(e.key === back || e.key === "PageUp"){ e.preventDefault(); turn(-1); }',
'    else if(e.key === "Home"){ e.preventDefault(); goTo(0, true); }',
'    else if(e.key === "End"){ e.preventDefault(); goTo(pages() - 1, true); }',
'  });',
'  var wheelLock = 0;',
'  window.addEventListener("wheel", function(e){',
'    if(Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;',
'    e.preventDefault();',
'    var now = Date.now();',
'    if(now - wheelLock < 380) return;',
'    if(Math.abs(e.deltaY) < 6) return;',
'    wheelLock = now;',
'    turn(e.deltaY > 0 ? 1 : -1);',
'  }, { passive: false });',
'',
'  /* 表紙・奥付の文字が1ページに収まるまで詰める */',
'  function fitsIn(inner2){',
'    var cs = getComputedStyle(inner2);',
'    var r = (inner2.parentNode || inner2).getBoundingClientRect();',
'    var L = r.left   + (parseFloat(cs.paddingLeft)   || 0) - 1;',
'    var R = r.right  - (parseFloat(cs.paddingRight)  || 0) + 1;',
'    var T = r.top    + (parseFloat(cs.paddingTop)    || 0) - 1;',
'    var B = r.bottom - (parseFloat(cs.paddingBottom) || 0) + 1;',
'    var kids = inner2.children;',
'    for(var i=0;i<kids.length;i++){',
'      var k = kids[i].getBoundingClientRect();',
'      if(!k.width && !k.height) continue;',
'      if(k.left < L || k.right > R || k.top < T || k.bottom > B) return false;',
'    }',
'    return true;',
'  }',
'  function fitCovers(){',
'    var inners = document.querySelectorAll(".cover .inner, .colophon .inner");',
'    for(var i=0;i<inners.length;i++){',
'      var inr = inners[i];',
'      var big = inr.querySelector("h1, .mark");',
'      var em  = inr.querySelector(".emblem");',
'      if(big) big.style.fontSize = "";',
'      if(em)  em.style.width = "";',
'      var guard = 0;',
'      while(guard++ < 90 && !fitsIn(inr)){',
'        var shrunk = false;',
'        if(big){',
'          var fs = parseFloat(getComputedStyle(big).fontSize);',
'          if(fs > 11){ big.style.fontSize = (fs * 0.95) + "px"; shrunk = true; }',
'        }',
'        if(!shrunk && em){',
'          var ew = em.getBoundingClientRect().width / zoom();',
'          if(ew > 42){ em.style.width = (ew * 0.92) + "px"; shrunk = true; }',
'        }',
'        if(!shrunk) break;',
'      }',
'    }',
'  }',
'',
'  /* 見出しや図版の幅を行送りの倍数にそろえ、ページの境目が行の途中に来ないようにする */',
'  function snapGrid(){',
'    if(!vert) return;',
'    var adv = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--line-adv"));',
'    if(!(adv > 0)) return;',
'    var z = zoom();',
'    var blocks = reel.querySelectorAll(".divider, .prose h3, .prose figure:not(.p-plate):not(.p-top), .prose .code, .outline");',
'    for(var k=0;k<blocks.length;k++){',
'      var el = blocks[k];',
'      el.style.width = ""; el.style.marginRight = ""; el.style.marginLeft = "";',
'      var cs = getComputedStyle(el);',
'      var mr = parseFloat(cs.marginRight) || 0;',
'      var ml = parseFloat(cs.marginLeft) || 0;',
'      var wd = el.getBoundingClientRect().width / z;',
'      el.style.marginRight = (Math.round(mr / adv) * adv) + "px";',
'      el.style.marginLeft  = (Math.round(ml / adv) * adv) + "px";',
'      if(wd > 0) el.style.width = (Math.max(1, Math.ceil(wd / adv - 0.02)) * adv) + "px";',
'    }',
'    var paras = reel.querySelectorAll(".prose p, .prose h3");',
'    for(var m=0;m<paras.length;m++){',
'      var pm = parseFloat(getComputedStyle(paras[m]).marginLeft) || 0;',
'      paras[m].style.marginLeft = (Math.max(0, Math.round(pm / adv)) * adv) + "px";',
'    }',
'    snapBoxes();',
'  }',
'',
'  /* 入れ物の幅を中身に合わせて詰め直す。ページ揃えで詰め物を挿むと',
'     中身が伸びるので、そのたびに呼び直す必要がある。 */',
'  function snapBoxes(){',
'    if(!vert) return;',
'    var adv = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--line-adv"));',
'    if(!(adv > 0)) return;',
'    var z = zoom();',
'    var boxes = reel.querySelectorAll(".prose, section.movement");',
'    for(var i=0;i<boxes.length;i++){',
'      var bx = boxes[i];',
'      bx.style.width = "";',
'      var bw = bx.getBoundingClientRect().width / z;',
'      if(bw > 0) bx.style.width = (Math.max(1, Math.ceil(bw / adv - 0.02)) * adv) + "px";',
'    }',
'  }',
'',
'  /* 巻物の先頭から見た位置。縦組みは右へ行くほど手前。 */',
'  function startOf(el){',
'    var ref = reel.firstElementChild;',
'    return vert',
'      ? (ref.getBoundingClientRect().right - el.getBoundingClientRect().right) / zoom()',
'      : (el.getBoundingClientRect().left - ref.getBoundingClientRect().left) / zoom();',
'  }',
'',
'  /* 別丁・天の図版をページの頭へ送る。',
'     図版の前に余白を足して押すと、押したぶんだけ前のページが空いてしまう。',
'     そこで図版そのものを、本文の中の「ページの切れ目」まで運ぶ。',
'     運び先は段落の途中でもよい。浮かせた図版は、置かれた行から場所を取る。 */',
'  /* 別丁・天はページの頭へ送る。ほかの横組みの島（コード図版・図表・写真）は、',
'     ページの境目にかかるときだけ次のページへ送る。またいだまま置くと絵が切れる。',
'     どちらも余白で押すのではなく、島そのものを本文の中の切れ目まで運ぶ。 */',
'  var figHomes = null;',
'  function collectFigures(){',
'    if(figHomes) return figHomes;',
'    figHomes = [];',
'    var list = reel.querySelectorAll("figure, .code");',
'    for(var i=0;i<list.length;i++){',
'      var el = list[i];',
'      if(el.closest(".footnotes") || el.closest(".outline")) continue;',
'      /* 入れ子になっている島は、外側だけを動かす */',
'      if(el.parentElement && el.parentElement.closest("figure, .code")) continue;',
'      var mark = document.createElement("span");',
'      mark.className = "fig-home";',
'      el.parentNode.insertBefore(mark, el);',
'      figHomes.push({ fig:el, mark:mark, host:null, gap:null, undo:null,',
'        page: el.classList.contains("p-plate") || el.classList.contains("p-top") });',
'    }',
'    return figHomes;',
'  }',
'  function restoreFigures(){',
'    var a = collectFigures();',
'    for(var i=0;i<a.length;i++){',
'      if(a[i].fig.parentNode) a[i].fig.parentNode.removeChild(a[i].fig);',
'      a[i].mark.parentNode.insertBefore(a[i].fig, a[i].mark);',
'      if(a[i].undo){ undoSplit(a[i].undo); a[i].undo = null; }',
'      if(a[i].host){ a[i].host.normalize(); a[i].host = null; }',
'      if(a[i].gap && a[i].gap.parentNode){ a[i].gap.parentNode.removeChild(a[i].gap); a[i].gap = null; }',
'    }',
'  }',
'  /* 目印より後ろの、割ってよい文字だけを集める。',
'     割ってよいのは段落の中の文字だけ。箇条書きや見出しの中に図版を入れると、',
'     その要素の字下げに引きずられて位置がずれる。 */',
'  function hostP(n){',
'    var e = n.parentNode;',
'    while(e && e !== reel){',
'      var tag = e.tagName;',
'      /* コードや説明文の中は割らない。文字が組み替わってしまう。 */',
'      if(tag === "PRE" || tag === "CODE" || tag === "FIGCAPTION") return null;',
'      /* 段落・箇条書き・見出しの地の文なら割ってよい。',
'         箇条書きの字下げで位置がずれることがあるが、置いたあとに検算して弾く。 */',
'      if(tag === "P" || tag === "LI" || tag === "H3") return e;',
'      e = e.parentNode;',
'    }',
'    return null;',
'  }',
'  function textsAfter(mark, limit){',
'    var out = [], seen = false;',
'    var walk = document.createTreeWalker(limit, NodeFilter.SHOW_TEXT, null);',
'    while(walk.nextNode()){',
'      var n = walk.currentNode;',
'      if(!seen){',
'        if(mark.compareDocumentPosition(n) & Node.DOCUMENT_POSITION_FOLLOWING) seen = true;',
'        else continue;',
'      }',
'      if(n.nodeValue && n.nodeValue.replace(/\\s/g, "") && hostP(n)) out.push(n);',
'    }',
'    return out;',
'  }',
'  /* 強調やリンクの内側で割るときは、その要素ごと前後に分ける。',
'     こうすると図版は段落の直下に入り、位置が素直に決まる。あとで元に戻せるよう控えを残す。 */',
'  function splitOut(node, offset, block){',
'    var tail = node.splitText(offset), undo = [], n = tail;',
'    while(n.parentNode && n.parentNode !== block){',
'      var par = n.parentNode, clone = par.cloneNode(false), m = n;',
'      while(m){ var nx = m.nextSibling; clone.appendChild(m); m = nx; }',
'      par.parentNode.insertBefore(clone, par.nextSibling);',
'      undo.push({ orig:par, clone:clone });',
'      n = clone;',
'    }',
'    return { at:n, undo:undo };',
'  }',
'  function undoSplit(u){',
'    for(var i=u.length-1;i>=0;i--){',
'      var o = u[i].orig, c = u[i].clone;',
'      while(c.firstChild) o.appendChild(c.firstChild);',
'      if(c.parentNode) c.parentNode.removeChild(c);',
'    }',
'  }',
'  function charPos(node, i){',
'    var r = document.createRange();',
'    r.setStart(node, i);',
'    r.setEnd(node, Math.min(i + 1, node.nodeValue.length));',
'    var b = r.getBoundingClientRect();',
'    if(!b.width && !b.height) return null;',
'    var ref = reel.firstElementChild.getBoundingClientRect();',
'    return vert ? (ref.right - b.right) / zoom() : (b.left - ref.left) / zoom();',
'  }',
'  /* ページの切れ目にあたる文字を二分探索で探す */',
'  function spotAt(nodes, target){',
'    for(var i=0;i<nodes.length;i++){',
'      var n = nodes[i], len = n.nodeValue.length;',
'      if(!len) continue;',
'      var last = charPos(n, len - 1);',
'      if(last === null || last < target - 0.5) continue;',
'      var lo = 0, hi = len - 1;',
'      while(lo < hi){',
'        var mid = (lo + hi) >> 1;',
'        var p = charPos(n, mid);',
'        if(p === null || p < target - 0.5) lo = mid + 1; else hi = mid;',
'      }',
'      return { node:n, offset:lo, pos:charPos(n, lo) };',
'    }',
'    return null;',
'  }',
'  function placeFigures(){',
'    if(!vert) return;',
'    var a = collectFigures();',
'    var w = pw();',
'    /* まず全部外す。後ろの島が居座っていると、割り込む先が本文で埋まらず、',
'       行き場がなくなって詰め物ばかりになる。外してから先頭順に置き直す。 */',
'    for(var k=0;k<a.length;k++){',
'      var g = a[k];',
'      if(g.fig.parentNode) g.fig.parentNode.removeChild(g.fig);',
'      if(g.undo){ undoSplit(g.undo); g.undo = null; }',
'      if(g.host){ g.host.normalize(); g.host = null; }',
'      if(g.gap && g.gap.parentNode){ g.gap.parentNode.removeChild(g.gap); g.gap = null; }',
'    }',
'    for(var i=0;i<a.length;i++){',
'      var h = a[i];',
'      /* 目印の位置ではなく、いったん元の場所へ戻した島が実際に落ちる位置を測る。',
'         島は前の浮きものを避けて置かれるので、目印の位置とは一致しない。 */',
'      h.mark.parentNode.insertBefore(h.fig, h.mark);',
'      var wid = h.fig.getBoundingClientRect().width / zoom();',
'      var at = startOf(h.fig);',
'      h.fig.parentNode.removeChild(h.fig);',
'      var rem = ((Math.round(at) % w) + w) % w;',
'      var target;',
'      if(h.page) target = (rem < 1) ? at : at + (w - rem);',
'      else       target = (rem + wid <= w + 1) ? at : at + (w - rem);',
'      if(target - at < 1){',
'        /* いまの場所で収まる。動かさない。 */',
'        h.mark.parentNode.insertBefore(h.fig, h.mark);',
'        continue;',
'      }',
'      var limit = h.mark.closest("section.movement") || reel;',
'      var spot = spotAt(textsAfter(h.mark, limit), target);',
'      /* 見つけた文字が「切れ目から始まる行」に載っているときだけ運ぶ。',
'         字面は行の頭から少し内側に来るので、行送りを物差しにして判る。',
'         1行以上ずれるくらいなら、詰め物で押したほうがよい。 */',
'      var adv = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--line-adv")) || 20;',
'      var placed = false;',
'      if(spot && spot.pos !== null && spot.pos - target > -1 && spot.pos - target < adv * 0.9){',
'        var s = splitOut(spot.node, spot.offset, hostP(spot.node));',
'        s.at.parentNode.insertBefore(h.fig, s.at);',
'        h.host = s.at.parentNode;',
'        h.undo = s.undo;',
'        /* 運んだ先で、前の島の余白に押されて落ちきらないことがある。',
'           実際の位置を測って、合わなければ詰め物に切り替える。 */',
'        /* 行の頭に載っていればよい。1px 単位で合わせようとすると、',
'           前の島の余白や格子の丸めで弾かれてしまう。 */',
'        if(Math.abs(startOf(h.fig) - target) < adv * 0.6) placed = true;',
'        else {',
'          h.fig.parentNode.removeChild(h.fig);',
'          undoSplit(h.undo); h.undo = null;',
'          h.host.normalize(); h.host = null;',
'        }',
'      }',
'      if(!placed){',
'        /* 運び先が見つからない、または合わないときは元の場所に置いて詰め物で押す。',
'           図版に余白を足すと、その余白まで本文が避けてしまうので使わない。 */',
'        h.gap = document.createElement("div");',
'        h.gap.className = "page-gap";',
'        h.gap.style.width = Math.max(0, Math.round(target - at)) + "px";',
'        h.mark.parentNode.insertBefore(h.gap, h.mark);',
'        h.mark.parentNode.insertBefore(h.fig, h.mark);',
'      }',
'    }',
'    /* 置き終えたあとの最終確認。運んだ先が動いてページをまたぐものが残ることがある。',
'       絵が切れるのがいちばん困るので、そこだけは詰め物に切り替えて必ず解消する。 */',
'    for(var j=0;j<a.length;j++){',
'      var q = a[j];',
'      if(!q.fig.parentNode) continue;',
'      var s2 = startOf(q.fig), w2 = q.fig.getBoundingClientRect().width / zoom();',
'      var r2 = ((Math.round(s2) % w) + w) % w;',
'      if(r2 + w2 <= w + 1) continue;',
'      q.fig.parentNode.removeChild(q.fig);',
'      if(q.undo){ undoSplit(q.undo); q.undo = null; }',
'      if(q.host){ q.host.normalize(); q.host = null; }',
'      if(q.gap && q.gap.parentNode){ q.gap.parentNode.removeChild(q.gap); q.gap = null; }',
'      q.mark.parentNode.insertBefore(q.fig, q.mark);',
'      var a2 = startOf(q.fig);',
'      var r3 = ((Math.round(a2) % w) + w) % w;',
'      var t2 = (r3 < 1) ? a2 : a2 + (w - r3);',
'      if(t2 - a2 >= 1){',
'        q.fig.parentNode.removeChild(q.fig);',
'        q.gap = document.createElement("div");',
'        q.gap.className = "page-gap";',
'        q.gap.style.width = Math.round(t2 - a2) + "px";',
'        q.mark.parentNode.insertBefore(q.gap, q.mark);',
'        q.mark.parentNode.insertBefore(q.fig, q.mark);',
'      }',
'    }',
'  }',
'',
'  /* 縦組みで、表をページの境目にまたがせず、小見出しをページの末尾に取り残さない。',
'     どちらも詰め物で次のページへ送る。表は本文の途中へ運ぶと読む順番が変わるので、図版のようには運ばない。 */',
'  function keepTogether(){',
'    if(!vert) return;',
'    var old = reel.querySelectorAll(".keep-gap");',
'    for(var i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);',
'    var w = pw(), z = zoom();',
'    var items = reel.querySelectorAll(".prose table, .prose h3, .prose h4");',
'    for(var k=0;k<items.length;k++){',
'      var el = items[k];',
'      var at = startOf(el), rem = ((Math.round(at) % w) + w) % w;',
'      var bad;',
'      if(el.tagName === "TABLE"){',
'        bad = rem + el.getBoundingClientRect().width / z > w + 1;',
'      } else {',
'        var nx = el.nextElementSibling;',
'        if(!nx) continue;',
'        bad = Math.floor((startOf(nx) + 1) / w) !== Math.floor((at + 1) / w);',
'      }',
'      if(!bad || rem < 1) continue;',
'      var gap = document.createElement("div");',
'      gap.className = "page-gap keep-gap";',
'      gap.style.width = Math.round(w - rem) + "px";',
'      el.parentNode.insertBefore(gap, el);',
'    }',
'  }',
'',
'  /* 章と奥付が必ずページの先頭から始まるように、前に余白を足す。',
'     図版は別扱い。余白で押すと前のページが空いてしまうので placeFigures で運ぶ。 */',
'  function alignPages(){',
'    /* 縦組み専用。横組みでは章は段組みの break-before でページの頭に来る。',
'       ここで margin-right を足すと、横組みでは行の幅そのものを食い潰し、',
'       1行1文字で組まれてしまう。 */',
'    if(!vert) return;',
'    var ref = reel.firstElementChild;',
'    if(!ref) return;',
'    var marks = reel.querySelectorAll("section.movement, .toc, .draftnote");',
'    for(var i=0;i<marks.length;i++) marks[i].style.marginRight = "";',
'    snapBoxes();',
'    var z = zoom(), w = pw();',
'    for(var pass=0; pass<6; pass++){',
'      var changed = false;',
'      for(var i2=0;i2<marks.length;i2++){',
'        var el2 = marks[i2];',
'        var cur = parseFloat(el2.style.marginRight) || 0;',
'        var rem = ((Math.round(startOf(el2)) % w) + w) % w;',
'        if(rem > 1 && rem < w - 1){ el2.style.marginRight = (cur + (w - rem)) + "px"; changed = true; }',
'      }',
'      if(!changed) break;',
'      snapBoxes();',
'    }',
'    /* 末尾が半端だと最後のページに次の行が覗くため、1ページぶんに満たす */',
'    var book = reel.querySelector(".book");',
'    if(book){',
'      book.style.paddingLeft = "";',
'      var over = Math.round(reel.getBoundingClientRect().width / z) % w;',
'      if(over > 1) book.style.paddingLeft = (w - over) + "px";',
'    }',
'  }',
'',
'  /* 紙が画面に収まらない場合は、比率を保ったまま縮小する */',
'  function fit(){',
'    stage.style.transform = "";',
'    var s = Math.min(1, (window.innerHeight - 96) / stage.offsetHeight,',
'                        (window.innerWidth  - 48) / stage.offsetWidth);',
'    if(s >= 0.999) return;',
'    s = Math.floor(s * 200) / 200;',
'    stage.style.transform = "scale(" + s + ")";',
'  }',
'',
'  function layout(){',
'    var keep = idx;',
'    fitCovers();',
'    /* 横組みは段ひとつがページひとつ。窓の幅は整数で送るので、段も同じ整数に揃える。',
'       端数のままだと段ごとに少しずつずれ、後ろのページで版面から外れる。 */',
'    if(!vert) reel.style.width = pw() + "px";',
'    restoreFigures();',
'    snapGrid();',
'    /* 図版を運ぶと後ろの章の位置が動くので、揃え直しと交互に繰り返す */',
'    for(var i=0;i<4;i++){ alignPages(); placeFigures(); keepTogether(); }',
'    fit();',
'    goTo(keep, false);',
'  }',
'',
'  layout();',
'  if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);',
'  window.addEventListener("resize", layout);',
'})();',
'<\/script>'
].join('\n');

function schedulePreview(){ clearTimeout(pvTimer); pvTimer = setTimeout(renderPreview, 260); }
function renderPreview(){
  const book = getBook(); const frame = document.getElementById('previewFrame');
  if(!book){ frame.srcdoc = ''; return; }
  if(previewMode === 'book'){ frame.srcdoc = buildBookHtml(book); updateProgress(); return; }
  const ch = getChapter();
  if(!ch){
    frame.srcdoc = '<div style="padding:60px 30px;color:#697485;font-family:sans-serif">章を選択してください</div>';
    updateProgress(); return;
  }
  // 章プレビューも書き出しと同じ生成処理を通す。
  // 別経路で組み立てると、行送りの調整やページ整列が効かず結果が食い違うため。
  frame.srcdoc = buildBookHtml(Object.assign({}, book, { chapters: [ch] }), true);
  updateProgress();
}
function setPreviewMode(m){
  previewMode = m;
  document.getElementById('pvChapter').classList.toggle('btn-gold', m === 'chapter');

function updateProgress(){
  const book = getBook(); if(!book){ document.getElementById('progressLabel').textContent = ''; return; }

  book.chapters.forEach(c => c.blocks.forEach(b => { if(b.type === 'prose' || b.type === 'lead') chars += (b.text || '').length; }));
  document.getElementById('progressLabel').textContent = progressText(book) + ' · ' + chars.toLocaleString() + '字';
}

const hasFiles = (e) => Array.from((e.dataTransfer && e.dataTransfer.types) || []).indexOf('Files') >= 0;

/* 落とせる場所は3つある（本文欄・ブロック一覧・画像モーダル）。
   配線を散らすと付け忘れるので、ここに一本化する。
   FileList はイベントが終わると空になるため、必ず同期のうちに控えを取る。 */
function wireDropZone(el, onFiles, guard){
  const mark = (e) => {
    if(!hasFiles(e) || (guard && !guard())) return;
    e.preventDefault();
    el.classList.add('drop-on');
  };
  el.addEventListener('dragenter', mark);
  el.addEventListener('dragover', mark);
  el.addEventListener('dragleave', (e) => { if(e.target === el) el.classList.remove('drop-on'); });
  el.addEventListener('drop', (e) => {
    if(!hasFiles(e)) return;
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('drop-on');
    onFiles(Array.from(e.dataTransfer.files));
  });
}

/* 図は段落として置きたいので、前後に空行を確保してから差し込む。
   caretIn は差し込んだあとカーソルを置く位置（説明を続けて打てるように）。 */
function insertIntoTextarea(ta, text, caretIn){
  const s = ta.selectionStart == null ? ta.value.length : ta.selectionStart;
  const e = ta.selectionEnd == null ? s : ta.selectionEnd;
  const before = ta.value.slice(0, s), after = ta.value.slice(e);
  const pre  = (before === '' || /\n\n$/.test(before)) ? '' : (/\n$/.test(before) ? '\n' : '\n\n');
  const post = (after  === '' || /^\n\n/.test(after))  ? '' : (/^\n/.test(after)  ? '\n' : '\n\n');
  ta.value = before + pre + text + post + after;
  const caret = before.length + pre.length + (caretIn == null ? text.length : caretIn);
  ta.focus();
  ta.setSelectionRange(caret, caret);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

let lastProseTextarea = null;

/* 本文欄そのものに落とすと、カーソル位置に差し込む。
   説明文をすぐ打てるよう、カーソルは ![ ] の中に置く。 */
function attachImageDrop(ta){
  ta.addEventListener('focus', () => { lastProseTextarea = ta; });

    e.preventDefault();
    insert(files, '貼り付けた');

}

/* ============ 本文中の画像の指定 ============
   指定は Markdown の題名欄に置く。![説明](images/a.png "s wrap")
   手で書かせたいわけではないので、本文ブロックの下に操作列を出す。 */
/* 表示に使う組（cls）と、Markdown に書き込む語（kw）は別物。
   混ぜるとクラス名が本文に書き出されるので、はっきり分けておく。 */
const FIG_SIZES = [
  { cls:'',     kw:'',   label:'大' },
  { cls:'s-m',  kw:'m',  label:'中' },
  { cls:'s-s',  kw:'s',  label:'小' },
  { cls:'s-xs', kw:'xs', label:'極小' }
];
const FIG_PLACES = [
  { cls:'p-alone',    kw:'alone' },
  { cls:'p-wrap',     kw:'wrap' },
  { cls:'p-wrap-end', kw:'wrap-end' },
  { cls:'p-top',      kw:'top' },
  { cls:'p-plate',    kw:'plate' }
];
/* 天の割合。語そのものは置き方と同じ組なので、書き込み先も place。 */
const FIG_FRACS = [
  { cls:'f-13', kw:'top-1-3', label:'1/3' },
  { cls:'',     kw:'top',     label:'1/2' },
  { cls:'f-23', kw:'top-2-3', label:'2/3' }
];
/* 「起点・終点」は組方向で見え方が変わるので、言葉を合わせる */
function placeLabels(book){
  const v = book && book.direction === 'vertical';
  return {
    'p-alone':'単独',
    'p-wrap': v ? '上に回す' : '左に回す',
    'p-wrap-end': v ? '下に回す' : '右に回す',
    'p-top':'天',
    'p-plate':'別丁'
  };
}
/* 指定を書かなかったときの見え方。縦組みは回り込み、横組みは単独。 */
const defaultPlace = (book) => (book && book.direction === 'vertical') ? 'p-wrap' : 'p-alone';

function proseImageRefs(text){
  const re = /!\[([^\]]*)\]\(images\/([^)\s"]+)(?:\s+"([^"]*)")?\)/g;
  const src = String(text || ''), out = [];
  let m;
  while((m = re.exec(src)) !== null){
    // その行が参照だけでできているときにしか、大きさや置き方は効かない
    const from = src.lastIndexOf('\n', m.index) + 1;
    const to = src.indexOf('\n', m.index);
    const line = src.slice(from, to < 0 ? src.length : to).trim();
    out.push({ index:m.index, len:m[0].length, alt:m[1], name:m[2], title:m[3] || '', standalone: line === m[0] });
  }
  return out;
}

/* 題名欄の語を1つ差し替える。同じ種類の語は消してから足す。 */
function setFigureOption(block, refIndex, group, value){
  const refs = proseImageRefs(block.text);
  const r = refs[refIndex];
  if(!r) return false;
  const table = (group === 'size') ? FIG_SIZE : FIG_PLACE;
  const words = r.title.split(/[\s,、]+/).filter(Boolean)
    .filter(w => !(table[w] || table[w.toLowerCase()]));
  if(value) words.push(value);
  const title = words.join(' ');
  const md = '![' + r.alt + '](images/' + r.name + (title ? ' "' + title + '"' : '') + ')';
  block.text = block.text.slice(0, r.index) + md + block.text.slice(r.index + r.len);
  return true;
}
/* いま効いている指定を読み取る */
function currentFigureOption(book, ref, group){
  const cls = figureClasses(ref.title);
  if(group === 'size') return cls.filter(c => c.indexOf('s-') === 0)[0] || '';
  if(group === 'frac') return cls.filter(c => c.indexOf('f-') === 0)[0] || '';
  return cls.filter(c => c.indexOf('p-') === 0)[0] || defaultPlace(book);
}

function copyDiagramPrompt(block, btn){
  const text = buildDiagramPrompt(block.request || '');
  const done = (ok) => {
    const orig = btn.innerHTML;
    btn.innerHTML = ok ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>コピーしました'
                       : '<i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>コピーできません';
    lucide.createIcons();
    setTimeout(() => { btn.innerHTML = orig; lucide.createIcons(); }, 1800);
  };
  // navigator.clipboard は https / localhost でしか使えないため、失敗時は execCommand に落とす
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => done(true)).catch(() => done(fallbackCopy(text)));
  } else {
    done(fallbackCopy(text));
  }
}
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove(); return ok;
  }catch(e){ return false; }
}

function renderFigStrip(el, block, ta){
  const book = getBook();
  const refs = proseImageRefs(block.text);
  if(!refs.length){ el.innerHTML = ''; el.className = ''; return; }
  el.className = 'border-t border-slate-800/60 px-3 py-2 space-y-2';

  const labels = placeLabels(book);
  const imgs = (book && book.images) || {};
  const chip = (on, label, group, i, kw) =>
    '<button data-g="' + group + '" data-i="' + i + '" data-v="' + kw + '" ' +
    'class="px-1.5 py-0.5 rounded text-[10px] border transition cursor-pointer ' +
    (on ? 'btn-gold font-bold' : 'border-slate-800 text-slate-500 hover:text-slate-200') + '">' + label + '</button>';

  el.innerHTML = refs.map((r, i) => {
    const rec = imgs[r.name];
    const thumb = rec
      ? '<img src="' + imgDataUrl(rec) + '" alt="" class="w-8 h-8 object-cover rounded-sm border border-slate-800 shrink-0">'

        '</div>'
      : '<p class="text-[10px] text-slate-600">文の途中に置かれているので、大きさと置き方は効きません。行を分けると図版になります。</p>';
    return '<div class="flex items-start gap-2">' + thumb +
      '<div class="flex-1 min-w-0 space-y-1">' +
        '<p class="text-[10px] font-mono truncate ' + (rec ? 'text-slate-400' : 'text-rose-400/80') + '">' +

      '</div></div>';
  }).join('');

  el.querySelectorAll('button[data-g]').forEach(btn => {
    btn.onclick = () => {
      if(!setFigureOption(block, +btn.dataset.i, btn.dataset.g, btn.dataset.v)) return;
      if(ta) ta.value = block.text;   // 書き戻しても入力位置を失わないよう、その場で差し替える
      persist();
      renderFigStrip(el, block, ta);
    };
  });
}

function openImageModal(){
  const book = getBook(); if(!book){ alert('先に本を作成してください。'); return; }
  if(!book.images) book.images = {};
  document.getElementById('imgModal').classList.remove('hidden');
  renderImageGrid();
}
function closeImageModal(){ document.getElementById('imgModal').classList.add('hidden'); }

async function pickImages(ev){
  // input.value を空にすると FileList も空になるので、先に控えを取る
  const files = Array.from(ev.target.files || []);
  ev.target.value = '';
  const names = await addImageFiles(files);
  renderImageGrid();
  if(names.length) toast(names.length + ' 枚を追加しました');
}

function updateImageCount(){
  const book = getBook();
  const n = book && book.images ? Object.keys(book.images).length : 0;
  const el = document.getElementById('imgCount');
  if(el) el.textContent = n ? ' ' + n : '';
}

function renderImageGrid(){
  const book = getBook(); const grid = document.getElementById('imgGrid');
  if(!book || !grid) return;
  const names = Object.keys(book.images || {}).sort();
  const total = names.reduce((s, n) => s + (book.images[n].size || 0), 0);
  document.getElementById('imgTotal').textContent = names.length ? names.length + ' 枚 · ' + humanSize(total) : '';
  updateImageCount();

  if(!names.length){
    grid.innerHTML = '<p class="col-span-full text-center text-xs text-slate-600 py-6">まだ画像がありません。</p>';
    return;
  }
  grid.innerHTML = names.map(name => {
    const rec = book.images[name];
    const plates = plateWhere(book, name);
    const inText = imageUsage(book, name) - plateRefs(book, name);
    const dim = (rec.w && rec.h) ? rec.w + '×' + rec.h : '';
    const where = plates.concat(inText ? ['本文 ' + inText] : []).join(' · ') || '未使用';
    return '<div class="img-tile border border-slate-800 rounded overflow-hidden bg-[#0b1220]" data-name="' + esc(name) + '">' +
      '<div class="img-thumb h-28 flex items-center justify-center overflow-hidden">' +
        '<img src="' + imgDataUrl(rec) + '" alt="" class="max-h-28 max-w-full object-contain">' +
      '</div>' +
      '<div class="p-2 space-y-1.5">' +
        '<p class="text-[11px] font-mono text-slate-300 truncate" title="' + esc(name) + '">' + esc(name) + '</p>' +
        '<p class="text-[10px] text-slate-600">' + [dim, humanSize(rec.size), where].filter(Boolean).join(' · ') + '</p>' +
        '<div class="flex gap-1">' +
          '<button data-act="insert" class="flex-1 py-1 text-[11px] btn-gold rounded cursor-pointer">挿入</button>' +
          '<button data-act="rename" class="px-2 py-1 text-[11px] text-slate-400 hover:text-slate-200 border border-slate-800 rounded cursor-pointer">名前</button>' +
          '<button data-act="delete" class="px-2 py-1 text-[11px] text-rose-500/70 hover:text-rose-400 border border-slate-800 rounded cursor-pointer">削除</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => imageAction(btn.dataset.act, btn.closest('[data-name]').dataset.name);
  });
}

function imageAction(act, name){
  const book = getBook(); if(!book) return;
  if(act === 'insert'){
    const ch = getChapter();
    if(!ch || ch.status === 'plan'){ toast('草稿状態の章を開いてから挿入してください'); return; }
    if(lastProseTextarea && document.body.contains(lastProseTextarea)){
      insertIntoTextarea(lastProseTextarea, imageMarkdown(name), 2);
    } else {
      const b = newBlock('prose'); b.text = imageMarkdown(name);
      ch.blocks.push(b); persist(); renderBlocks();
    }
    closeImageModal();
    toast(name + ' を挿入しました');
    return;
  }
  if(act === 'rename'){
    const to = prompt('新しいファイル名（本文中の参照も書き換えます）', name);
    if(!to || !to.trim() || to === name) return;
    const clean = sanitizeImageName(to.trim());
    if(book.images[clean]){ alert('その名前はすでに使われています。'); return; }
    renameImage(book, name, clean);
    persist(); renderBlocks(); renderImageGrid();
    toast(name + ' → ' + clean);
    return;
  }
  if(act === 'delete'){
    const plates = plateWhere(book, name);
    const inText = imageUsage(book, name) - plateRefs(book, name);
    const where = plates.concat(inText ? ['本文で ' + inText + ' 回'] : []).join('と');
    const msg = where
      ? name + ' は' + where + 'に使われています。削除すると、その箇所は表示されなくなります。削除しますか？'
      : name + ' を削除しますか？';
    if(!confirm(msg)) return;
    delete book.images[name];
    PLATE_IMAGE_KEYS.forEach(k => { if(book[k] === name) book[k] = ''; });
    persist(); renderImageGrid();
    toast(name + ' を削除しました');
  }
}
