# このリポジトリ自身の検査。
# 検証スクリプトが「ツールの出力は通し、壊した箇所だけを落とす」ことを毎回確かめる（Red-First）。
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # 日本語の組版を検査するので、日本語フォントを入れておく（無いと豆腐になり、組版結果が変わる）
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
